.top{padding:35px 25px 18px}.top h2,.detail h2{font:600 clamp(35px,7vw,48px)/1.12 'Playfair Display',Georgia,serif;color:#244e37;margin:12px 0}.content,.detail{padding:0 25px 32px}.count{font-size:12px;color:#568069;margin:18px 0 14px}#list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-items:stretch}.plant{min-width:0;position:relative;display:flex;flex-direction:column;align-items:stretch;text-align:left;border:1px solid #e1e8df;border-radius:17px;padding:0 0 14px;overflow:hidden;background:#fff;box-shadow:0 5px 17px #1839200b;color:var(--text)}.plant:nth-child(4n+1){background:#edf3e9}.plant:nth-child(4n+2){background:#f6f0e4}.plant:nth-child(4n+3){background:#f4eae7}.plant:nth-child(4n+4){background:#eaf0f3}.thumb{width:100%;height:126px;display:grid;place-items:center;flex-shrink:0;background:linear-gradient(135deg,#d5e4d0,#e8eee0);color:#59876c;font-size:48px}.plant:nth-child(4n+2) .thumb{background:linear-gradient(135deg,#e5e5cc,#f4ead9)}.plant:nth-child(4n+3) .thumb{background:linear-gradient(135deg,#e7ddd5,#f4e5df)}.plant:nth-child(4n+4) .thumb{background:linear-gradient(135deg,#d5e4e7,#e9eef0)}.plant .plant-name{padding:12px 12px 0;min-width:0}.plant strong{display:block;font:600 clamp(15px,3.4vw,20px)/1.3 'Poppins',Arial,sans-serif;color:#244d38;overflow-wrap:anywhere}.plant em{display:block;color:#647268;font:normal 12px/1.5 'DM Sans',Arial,sans-serif;margin-top:7px}.arrow{position:absolute;right:12px;bottom:10px;color:#3c7653;font-size:20px}
.detail-hero{height:185px;background:radial-gradient(circle at 75% 35%,#e6eedf,transparent 50%),linear-gradient(135deg,#dce9d8,#f1f2e7);display:grid;place-items:center;color:#5b8a69;font-size:85px}.detail{padding-top:24px}.back{background:none;color:#2a6b48;border:0;padding:0;font-size:13px;font-weight:700}.latin{font:500 17px/1.5 'Poppins',Arial,sans-serif;color:#627468}.detail-title{display:flex;justify-content:space-between;align-items:center;gap:8px}.favorite{font-size:30px;background:none;border:0;color:#286443}.tabs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;overflow:visible;padding:23px 0}.tabs button{white-space:normal;min-height:65px;border:1px solid #dce4d8;border-radius:13px;padding:12px;background:#eaf2e7;color:#294a36;font-size:13px;font-weight:700;text-align:left;display:flex;align-items:center;gap:8px}.tabs button:nth-child(4n+2){background:#f6eee1}.tabs button:nth-child(4n+3){background:#e8eff4}.tabs button:nth-child(4n+4){background:#f5e9ec}.tabs button.active{background:#2c6a4a;color:#fff;border-color:#2c6a4a}.tab-icon{font-size:19px;flex-shrink:0}.section{padding:23px 0;border-bottom:1px solid var(--line)}.section h3{font:600 clamp(25px,5vw,31px)/1.2 'Playfair Display',Georgia,serif;color:#254d36;margin:0 0 10px}.section p{font-size:14px;line-height:1.85;color:#34483a;white-space:pre-line;margin:0}.section .label{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#6d896d;font-weight:700;margin-bottom:12px}.safety h3{color:#915d53}.notice{border-left:3px solid #b38b64;border-radius:0 10px 10px 0;background:#f5efe4;color:#4c594d;padding:13px 16px;font-size:12px;line-height:1.75;margin-top:20px}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:680px;width:100%;display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border-top:1px solid #dce4dc;height:76px;z-index:10;box-shadow:0 -4px 18px #19351d0c}.nav button{background:none;border:0;color:#78867b;font-size:11px}.nav button b{display:block;font-size:23px;font-weight:400;margin-bottom:4px}.nav button.active{color:#276947;font-weight:700}.field{display:grid;gap:7px;margin:15px 0}.field label{font-size:12px;color:var(--muted)}.field input{padding:13px;background:#fff;border:1px solid var(--line);color:var(--text);border-radius:9px}.action{background:#286a49;color:#fff;border:0;border-radius:9px;padding:13px 18px}.result{padding:20px;border:1px solid var(--line);margin-top:20px;background:#fff;border-radius:14px}.result strong{font:40px 'Playfair Display',Georgia,serif;color:#276746}a{color:#286a49}

const plants=[{"scientific":"Actaea racemosa L.","name":"Cimicífuga","id":0,"page":18,"fields":{"Família":"Ranunculaceae.(1) Sinonímia: Cimicifuga racemosa (L.) Nutt.","Nomenclatura popular":"Cimicifuga.(2)","Parte utilizada/órgão vegetal":"Raiz ou rizoma.(2)","INDICAÇÕES TERAPÊUTICAS":"Alívio dos sintomas do climatério, como rubor, fogachos, transpiração excessiva, palpitações, alterações do humor, ansiedade e depressão.(2)","CONTRAINDICAÇÕES":"Contraindicado para pacientes com histórico de hipersensibilidade a qualquer um dos componentes do fitoterápico. Pacientes portadoras de insuficiência hepática.(3) Esse fitoterápico é contraindicado durante a gravidez.(11,15)","PRECAUÇÕES DE USO":"Pacientes devem ser alertadas quanto ao aparecimento e sintomas sugestivos de insuficiência hepática, tais como astenia, inapetência, icterícia cutânea ou de escleróticas, epigastralgia severa acompanhada de náusea e vômito ou urina com coloração escura.(15) Nesses casos, deve-se suspender o uso. É necessária precaução em pacientes alérgicos à aspirina ou outros salicilatos.(15) Em associação à terapia de reposição hormonal, deve manter-se avaliação médica a cada seis meses.(4,15)","EFEITOS ADVERSOS":"Pode causar desconforto gastrointestinal, erupção cutânea,(12,13) cefaleia e tontura.(4,15)","INTERAÇÕES MEDICAMENTOSAS":"Pode ocorrer antagonização do efeito imunossupressor promovido pela ciclosporina e azatioprina, ou seja, uma imunoestimulação podendo levar à rejeição em pacientes transplantadas que fazem uso desse fitoterápico.(5) Pode ocorrer interação com a atorvastatina.(15) Deve ser utilizada com cautela se associado a outros agentes hipotensores, como betabloqueadores (metoprolol ou propanolol) e bloqueadores dos canais de cálcio (diltiazem ou verapamil).(6,15) Pode ocorrer interação com analgésicos e anestésicos e efeitos aditivos com agentes gastrointestinais.(15)","FORMAS FARMACÊUTICAS":"Cápsulas e comprimidos contendo a droga vegetal, extrato seco etanólico ou isopropílico.(9) Armazenar ao abrigo da luz em local fechado.(2)","VIAS DE ADMINISTRAÇÃO E POSOLOGIA (DOSE E INTERVALO)":"Oral. Dose diária: 6 mg extrato seco (extrato etanólico).(10) 40-200 mg de rizomas secos de cimicifuga diariamente divididos em doses ou 0,4-2 mL da tintura (1:10) em etanol a 60%, diariamente. A raiz em pó ou o chá 1-2 g, três vezes por dia.(15)","TEMPO DE UTILIZAÇÃO":"Não deve ser utilizada por mais de 6 meses.(14) O tempo de uso depende da indicação terapêutica e da evolução do quadro acompanhado pelo profissional prescritor.","SUPERDOSAGEM":"Pode causar vertigem, cefaleia, náusea, vômito, hipotensão arterial, distúrbios visuais e circulatórios.(7)","PRESCRIÇÃO":"Fitoterápico, somente sob prescrição médica."}},{"scientific":"Aesculus hippocastanum L.","name":"Castanha-da-índia","id":1,"page":21,"fields":{"Família":"Sapindaceae.(1)","Nomenclatura popular":"Castanha-da-índia.(2)","Parte utilizada/órgão vegetal":"Semente.(2)","INDICAÇÕES TERAPÊUTICAS":"Para o tratamento da insuficiência venosa e fragilidade capilar.(3,4,5)","CONTRAINDICAÇÕES":"Pacientes com histórico de hipersensibilidade e alergia a qualquer um dos componentes do fitoterápico não devem fazer uso do produto. Esse fitoterápico é contraindicado para pessoas com hipersensibilidade a escina ou a extratos de A. hippocastanum e pacientes com insuficiência renal ou hepática.(6) Há indícios de que a absorção de escina seja maior em crianças, predispondo-as a maior toxicidade.(7)","PRECAUÇÕES DE USO":"Toxicidade renal e hepática foram relatadas com o uso de preparados a base de A. hippocastanum em pacientes propensos a esse tipo de distúrbios.(6) Embora não existam restrições, pacientes idosos só devem utilizar o fitoterápico com orientação médica. De acordo com a categoria de risco de fármacos destinados às mulheres grávidas, esse fitoterápico está incluído na categoria de risco C: não foram realizados estudos em animais e em mulheres grávidas; ou então, os estudos em animais revelaram risco, mas não existem estudos disponíveis realizados em mulheres grávidas. Esse fitoterápico não deve ser utilizado por mulheres grávidas sem orientação médica, assim como por crianças e adolescentes.(18)","EFEITOS ADVERSOS":"Após ingestão do fitoterápico podem ocorrer, em casos isolados, prurido, náuseas e desconforto gátrico.(8,9) Raramente podem ocorrer irritação da mucosa gástrica e refluxo.(7)","INTERAÇÕES MEDICAMENTOSAS":"Esse fitoterápico não deve ser administrado com anticoagulantes orais, pois pode potencializar seu efeito anticoagulante.(7) Cerca de 90% de escina ligamse às proteínas plasmáticas, podendo interferir com a distribuição de outras drogas.(6,7) Um caso de insuficiência renal foi relatado após administração concomitante de escina e o antibiótico gentamicina.(10)","FORMAS FARMACÊUTICAS":"Cápsulas ou comprimidos contendo extrato etanólico seco padronizado e gel.(3) Armazenar ao abrigo da luz e de umidade.(3)","VIAS DE ADMINISTRAÇÃO E POSOLOGIA (DOSE E INTERVALO)":"Oral. Dose diária: 250 a 312 mg (dividida em duas vezes ao dia) do extrato padronizado contendo 16 a 20% de glicosídeos triterpênicos (equivalente a 100 mg de escina).(3) Tópico. Gel para uso tópico contendo 2% de escina.(3)","TEMPO DE UTILIZAÇÃO":"Não foram encontrados dados descritos na literatura consultada sobre o tempo máximo de utilização. O tempo de uso depende da indicação terapêutica e da evolução do quadro acompanhado pelo profissional prescritor.","SUPERDOSAGEM":"Se ingerido em altas doses esse fitoterápico pode causar vômitos, diarreia, fraqueza, espasmos musculares, dilatação da pupila, falta de coordenação e distúrbios da visão e da consciência.(11) Assim como todos os extratos vegetais ricos em saponinas, podem ocorrer irritação da mucosa gástrica e refluxo. Quando grande quantidade de escina é absorvida através da mucosa gastrointestinal irritada ou lesionada, pode ocorrer hemólise, associada a dano renal.(12,13) Em caso de superdosagem, suspender o fitoterápico imediatamente. Recomenda-se tratamento de suporte sintomático com medidas habituais de apoio e controle das funções vitais. Aesculus hippocastanum L.","PRESCRIÇÃO":"Fitoterápico, isento de prescrição médica."}},{"scientific":"Allium sativum L.","name":"Alho","id":2,"page":24,"fields":{"Família":"Amaryllidaceae.(1)","Nomenclatura popular":"Alho.(2,3)","Parte utilizada/órgão vegetal":"Bulbos frescos ou secos.(3,4)","INDICAÇÕES TERAPÊUTICAS":"Indicado como coadjuvante no tratamento de bronquite crônica, asma, como expectorante,(5) e como preventivo de alterações vasculares.(5,6) Coadjuvante no tratamento de hiperlipidemia, hipertensão arterial leve a moderada, dos sintomas de gripes e resfriados e auxiliar na prevenção da aterosclerose. (3,4,5,7,8)","CONTRAINDICAÇÕES":"Contraindicado para grávidas, pacientes com gastrite, úlcera gastroduodenal, hipertireoidismo, distúrbios da coagulação ou em tratamento com anticoagulantes,(9,10) histórico de hipersensibilidade e alergia a qualquer um dos componentes do fitoterápico.(4) Não deve ser usado em pré ou pós-operatórios, devendo ser suspenso pelo menos 10 dias antes de procedimentos cirúrgicos.(9,10)","PRECAUÇÕES DE USO":"Não usar em casos de hemorragia e tratamento com anticoagulantes e anti-hipertensivos.(4) Suspender o uso do fitoterápico duas semanas antes de intervenções cirúrgicas. Não usar em pessoas com gastrite, úlcera gastroduodenal, hipotensão arterial e hipoglicemia. Pode potencializar os efeitos antitrombóticos de fármacos anti-inflamatórios.(5)","EFEITOS ADVERSOS":"Esse fitoterápico pode causar ardência na cavidade oral e no trato gastrointestinal,(5) mialgia, fadiga, vertigem,(11) sudorese, bem como reações alérgicas e asma.(12) O uso desse fitoterápico pode causar decréscimo do hematócrito e da viscosidade sanguínea, aumentando o risco de sangramento pós-operatório,(13) bem como hematoma epidural espontâneo.(14) Efeitos gastrointestinais, tais como desconforto abdominal, náuseas, vômitos e diarreia também são possíveis. Odores corporais característicos de alho podem ocorrer com o uso desse fitoterápico.(15)","INTERAÇÕES MEDICAMENTOSAS":"Foi descrita interação potencial entre Allium sativum e varfarina.(4,5) Esse fitoterápico não pode ser utilizado em associação com anticoagulantes orais, heparina, agentes trombolíticos, antiagregantes plaquetários e anti-inflamatórios não-esteroidais, por aumentarem o risco de hemorragias.(16) A associação desse fitoterápico com inibidores da protease pode reduzir as concentrações séricas dessa classe, aumentando o risco de resistência ao antiretroviral e falhas no tratamento.(17,18) Além disso, pode diminuir a efetividade da clorzoxazona por induzir o seu metabolismo.(19,20)","FORMAS FARMACÊUTICAS":"Tintura, alcoolatura, extrato fluido e cápsulas com o óleo.(3,4,32)","VIAS DE ADMINISTRAÇÃO E POSOLOGIA (DOSE E INTERVALO)":"Oral. Tintura (1:5 em álcool 45%): acima de 12 anos tomar 50 a 100 gotas (2,5 a 5 mL) da tintura diluídas em 75 mL de água, duas a três vezes ao dia. (3) Óleo: 2-5 mg (dose diária).(4) Pó seco: 0,4-1,2 g (dose diária).(4) Alcoolatura e extrato fluido: 1 a 2 mL diluídos em 75 ml de água duas vezes ao dia.(32,33)","TEMPO DE UTILIZAÇÃO":"Não foram encontrados dados descritos na literatura consultada sobre o tempo máximo de utilização. O tempo de uso depende da indicação terapêutica e da evolução do quadro acompanhada pelo profissional prescritor.","SUPERDOSAGEM":"Não foram encontrados dados descritos na literatura consultada sobre problemas decorrentes de superdosagem. Em caso de administração de quantidades acima das recomendadas, suspender o uso e manter o paciente sob observação.","PRESCRIÇÃO":"Fitoterápico isento de prescrição médica. Allium sativum L."}},{"scientific":"Aloe vera (L.) Burm.f.","name":"Babosa","id":3,"page":28,"fields":{"Família":"Xanthorrhoeaceae.(1)","Nomenclatura popular":"Babosa, aloe.(2,3,4)","Parte utilizada/órgão vegetal":"Gel incolor mucilaginoso de folhas frescas.(4)","INDICAÇÕES TERAPÊUTICAS":"Queimaduras de primeiro e segundo graus, e como cicatrizante.(5,6)","CONTRAINDICAÇÕES":"É contraindicado em pacientes com hipersensibilidade aos componentes do fitoterápico e, em casos de alergia conhecida às plantas da família Xanthrrorhoeacea.(5)","PRECAUÇÕES DE USO":"Orientar a não utilização do produto se apresentar alteração da coloração.(5)","EFEITOS ADVERSOS":"Foram relatados alguns casos de dermatite de contato que podem estar associados à presença de constituintes antracênicos, comumente encontrados na parte externa da folha que não deve ser utilizada nas preparações farmacêuticas.(5)","INTERAÇÕES MEDICAMENTOSAS":"Não foram encontrados dados descritos na literatura consultada.","FORMAS FARMACÊUTICAS":"Gel hidrofílico e pomada.(5)","VIAS DE ADMINISTRAÇÃO E POSOLOGIA (DOSE E INTERVALO)":"Tópica. Aplicar na área afetada uma a três vezes ao dia.(6)","TEMPO DE UTILIZAÇÃO":"Não foram encontrados dados descritos na literatura consultada sobre o tempo máximo de utilização. O tempo de uso depende da indicação terapêutica e da evolução do quadro acompanhada pelo profissional prescritor.","SUPERDOSAGEM":"Não foram encontrados dados descritos na literatura consultada sobre problemas decorrentes de superdosagem. Em caso de administração de quantidades acima das recomendadas, suspender o uso e manter o paciente em observação.","PRESCRIÇÃO":"Fitoterápico isento de prescrição médica."}},{"scientific":"Calendula officinalis L.","name":"Calêndula","id":4,"page":30,"fields":{"Família":"Asteraceae.(1)","Nomenclatura popular":"Calêndula.(2)","Parte utilizada/órgão vegetal":"Flores.(3)","INDICAÇÕES TERAPÊUTICAS":"Uso externo como anti-inflamatório, cicatrizante e antisséptico.(4) Para o tratamento de lesões da pele e mucosas, promovendo a cicatrização e modulando os possíveis focos inflamatórios.(5,6)","CONTRAINDICAÇÕES":"Contraindicado a pacientes com histórico de hipersensibilidade ou alergia aos componentes do fitoterápico ou a outras plantas da família Asteraceae. (7) Não deve ser administrado durante a gravidez, lactação ou para crianças sem supervisão médica.(8)","PRECAUÇÕES DE USO":"Não foram encontrados dados descritos na literatura consultada.","EFEITOS ADVERSOS":"Reações alérgicas e sensibilização da pele foram relatadas. Efeitos espermicida, antifertilizante e uterotônico também foram relatados.(7)","INTERAÇÕES MEDICAMENTOSAS":"Não foram encontrados dados descritos na literatura consultada.","FORMAS FARMACÊUTICAS":"Infusão: 1 a 2 g em 150 mL de água.(4) Tintura: 1:10 em álcool 70% ou 1:5 em álcool 90% .(4,8,9) Extrato fluido: 1:1 em álcool 40%.(9) Gel: com extrato glicólico a 10%.(8) Creme: com extrato glicólico a 10%.(8) Pomada (base de lanovaselina) a 10% com extrato hidroalcoolico (tintura 1:5).(34)","VIAS DE ADMINISTRAÇÃO E POSOLOGIA (DOSE E INTERVALO)":"Tópica Infusão: aplicar três vezes ao dia com auxílio de algodão ou sob a forma de bochechos ou gargarejos.(28) Tintura: realizar bochechos ou gargarejos com 25 mL de tintura diluída em 100 mL de água.(28) Gel: aplicar na área afetada três vezes ao dia a formulação contendo 10% da tintura.(28) Creme ou pomada: aplicar na área afetada três vezes ao dia nos casos de eczemas ou uma vez ao dia nos casos de feridas a formulação contendo 10% do extrato glicólico.(28, 34)","TEMPO DE UTILIZAÇÃO":"O tempo de uso depende da indicação terapêutica e da evolução do quadro acompanhada pelo profissional prescritor.","SUPERDOSAGEM":"Não foram encontrados dados descritos na literatura consultada sobre problemas decorrentes de superdosagem para o uso externo. Em caso de administração de quantidades acima das recomendadas ou por outra via, suspender o uso e manter o paciente sob observação.","PRESCRIÇÃO":"Fitoterápico, isento de prescrição médica."}},{"scientific":"Cynara scolymus L.","name":"Alcachofra","id":5,"page":35,"fields":{"Família":"Asteraceae.(1)","Nomenclatura popular":"Alcachofra.(2)","Parte utilizada/órgão vegetal":"Folhas.(2)","INDICAÇÕES TERAPÊUTICAS":"Antidispéptico, antiflatulento, diurético. Auxiliar na prevenção da aterosclerose. Coadjuvante no tratamento de dislipidemia mista leve a moderada e como auxiliar nos sintomas da síndrome do intestino irritável.(3,4,16,17,18,19,20)","CONTRAINDICAÇÕES":"Contraindicado para pacientes com histórico de hipersensibilidade e alergia a qualquer um dos componentes do fitoterápico ou a outras plantas da família Asteraceae.(4) Também é contraindicado em casos de obstrução do ducto biliar, gravidez e lactação.(4,5,6)","PRECAUÇÕES DE USO":"O uso concomitante com diuréticos em casos de hipertensão arterial ou cardiopatia deve ser realizado sob estrita supervisão médica, dada à possibilidade de haver descompensação da pressão arterial, ou, se a eliminação de potássio for considerável, pode ocorrer potencialização de fármacos cardiotônicos.(4) A ocorrência de hipersensibilidade para C. scolymus foi relatada, devido à presença de lactonas sesquiterpênicas como a cinaropicrina.(4) Não existem estudos disponíveis para recomendar o uso em menores de 12 anos ou durante a gravidez.(4) Não deve ser utilizado por mulheres grávidas sem orientação médica.(4)","EFEITOS ADVERSOS":"Efeito laxante em pessoas sensíveis aos componentes do fitoterápico.(5)","INTERAÇÕES MEDICAMENTOSAS":"Redução da eficácia de medicamentos que interferem na coagulação sanguínea, como ácido acetilsalicílico e anticoagulantes cumarínicos (ex. varfarina).(4) Potenciais interações: pode diminuir as concentrações sanguíneas de fármacos de medicamentos metabolizados pelas CYP3A4, CYP2B6 e CYP2D6, uma vez que a C. scolymus é indutora dessas enzimas.","FORMAS FARMACÊUTICAS":"Droga vegetal encapsulada, comprimido (droga vegetal), infusão, e extrato seco padronizado.(3,5)","VIAS DE ADMINISTRAÇÃO E POSOLOGIA (DOSE E INTERVALO)":"Oral. Dose diária: 1-2 g de extrato seco aquoso.(3,7,8,9) Tomar duas cápsulas, de duas a quatro vezes ao dia.(5)","TEMPO DE UTILIZAÇÃO":"Se os sintomas persistirem por mais de 2 semanas durante o uso do fitoterápico, um médico deve ser consultado.","SUPERDOSAGEM":"Não foram encontrados dados descritos na literatura consultada sobre problemas decorrentes de superdosagem. Em caso de administração de quantidades acima das recomendadas, suspender o uso e manter o paciente sob observação.","PRESCRIÇÃO":"Fitoterápico isento de prescrição médica."}},{"scientific":"Echinacea purpurea (L.) Moench","name":"Equinácea","id":6,"page":38,"fields":{"Família":"Asteraceae.(1)","Nomenclatura popular":"Equinácea.(2)","Parte utilizada/órgão vegetal":"Raiz.(5)","INDICAÇÕES TERAPÊUTICAS":"Preventivo e coadjuvante no tratamento dos sintomas de resfriados.(5)","CONTRAINDICAÇÕES":"Devido à possível ativação de agressões auto-imunes e outras respostas imunes hiper-reativas, o fitoterápico não deve ser administrado em pacientes com esclerose múltipla, colagenose, Síndrome da Imunodeficiência Adquirida (SIDA), tuberculose, pacientes em uso de medicamentos imunossupressores e outras desordens auto-imunes.(3,4) Contraindicado para crianças, grávidas e pacientes com histórico de hipersensibilidade e alergia a qualquer um dos componentes do fitoterápico.(5)","PRECAUÇÕES DE USO":"Esse fitoterápico não deve ser utilizado por grávidas e lactantes sem orientação médica.(3) Não deve ser utilizado em casos de doenças auto-imunes (encefalites difusa, eritema nodoso, trombocitopenia imunomediada, síndrome de Evans, síndrome de Sjögren com disfunção tubular renal), infecções por HIV e tuberculose. Leucopenia pode ocorrer pela utilização a longo prazo (mais de 8 semanas).(5)","EFEITOS ADVERSOS":"Pode causar febre e distúrbios gastrointestinais, como náusea, vômito e paladar desagradável logo após a ingestão. Raras reações alérgicas tais como prurido e agravamento de quadros asmáticos.(4) Reações de hipersensibilidade foram relatadas, como dermatite atópica, urticária, Síndrome de Stevens Johnson, angioedema da pele, edema Quincke e broncoespasmo.","INTERAÇÕES MEDICAMENTOSAS":"Deve ser administrado com cautela em associação com fármacos cujo metabolismo é dependente das enzimas CYP.(6)","FORMAS FARMACÊUTICAS":"Cápsulas e comprimidos contendo extrato seco (etanólico).(3) Raiz seca pulverizada.(5)","VIAS DE ADMINISTRAÇÃO E POSOLOGIA (DOSE E INTERVALO)":"Oral: extrato seco 250 mg, 1 a 3 vezes ao dia (equivalente a 10-30 mg de ácido chicórico por dia).(2) Extrato seco (5,5 - 7.5:1) 30 mg de extrato, equivalente a 200 mg de droga vegetal: 6-9 comprimidos por dia.(5) Raiz seca pulverizada, tomar duas cápsulas, três vezes ao dia.(4,5,13)","TEMPO DE UTILIZAÇÃO":"Não utilizar por mais que 8 semanas sucessivas.(3)","SUPERDOSAGEM":"Não foram encontrados dados descritos na literatura consultada sobre problemas decorrentes de superdosagem. Em caso de administração acima das doses recomendadas, suspender o uso e manter o paciente sob observação.(5)","PRESCRIÇÃO":"Fitoterápico somente sob prescrição médica."}},{"scientific":"Equisetum arvense L.","name":"Cavalinha","id":7,"page":40,"fields":{"Família":"Equisetaceae.(1)","Nomenclatura popular":"Cavalinha.(2)","Parte utilizada/órgão vegetal":"Folhas e partes aéreas.(3)","INDICAÇÕES TERAPÊUTICAS":"Diurético.(4,5)","CONTRAINDICAÇÕES":"Contraindicado para menores de 12 anos, grávidas, lactantes e pacientes com histórico de hipersensibilidade e alergia a qualquer um dos componentes do fitoterápico.(6,7,8) Contraindicado para pacientes nos quais a ingestão reduzida de líquidos é recomendada (por exemplo, doenças cardíacas e renais severas).(8)","PRECAUÇÕES DE USO":"A ingestão crônica diminui níveis da vitamina B1 (tiamina) e o efeito diurético pode causar a perda de potássio (hipocalemia).(7) Em pacientes que apresentam insuficiência renal crônica e que fazem uso de medicamentos que alteram níveis de potássio, pode causar hipercalemia.(8) Se as queixas ou sintomas tais como febre, disúria, espasmo ou hematúria ocorrerem durante o uso do fitoterápico um médico deverá ser consultado.(8) Para outras preparações, exceto o chá medicinal (infuso), recomenda-se manter a ingestão de líquidos apropriada.(8)","EFEITOS ADVERSOS":"Bloqueio atrioventricular transitório, distúrbios gastrointestinais e reações alérgicas.(8)","INTERAÇÕES MEDICAMENTOSAS":"O uso de extratos de E. arvense pode inibir a enzima CYP1A2, interferindo possivelmente com fármacos metabolizados por essa via.(9)","FORMAS FARMACÊUTICAS":"Tintura: (1:4-5) em solução hidroetanólica a 31,5% (p/p); Tintura (1:5) em solução hidroetanólica a 96% (v/v); Cápsula e comprimido contendo extrato seco (4- 7:1) com extração aquosa; Cápsula e comprimido contendo extrato seco (7,5-10,5:1) com extração hidroetanólica a 70% (v/v);(8) Chá medicinal (infusão).(10,11)","VIAS DE ADMINISTRAÇÃO E POSOLOGIA (DOSE E INTERVALO)":"Oral Adulto: a) infusão de folhas ou partes aéreas de 2-3 g em 250 mL de água fervente (xícara de chá), (8, 10, 12); b) droga vegetal rasurada: 570 mg; c) tintura:(1:4-5) em solução hidroetanólico a 31,5% (p/p): 20 gotas; d) tintura: (1:5) em solução hidroetanólico a 96% (v/v): 30 a 40 gotas; e) extrato seco (4-7:1) com extração aquosa: 185 mg; f) extrato seco (7,5-10,5:1) com extração hidroetanólica a 70% (v/v): 200 – 225 mg.(8) Dose diária: 3 doses; Dose diária máxima: 4 doses.(8)","TEMPO DE UTILIZAÇÃO":"Utilizar por duas a quatro semanas. Se os sintomas persistirem após uma semana do uso do fitoterápico um médico ou profissional da saúde qualificado deverá ser consultado.(8)","SUPERDOSAGEM":"Não foram encontrados dados descritos na literatura consultada sobre problemas decorrentes de superdosagem. Em caso de administração de quantidades acima das recomendadas o paciente deve ser observado.","PRESCRIÇÃO":"Fitoterápico, isento de prescrição médica. Equisetum arvense L."}},{"scientific":"Ginkgo biloba L.","name":"Ginkgo","id":8,"page":43,"fields":{"Família":"Ginkgoaceae.(1)","Nomenclatura popular":"Ginkgo.(2)","Parte utilizada/órgão vegetal":"Folhas.(2)","INDICAÇÕES TERAPÊUTICAS":"Vertigem e zumbidos (tinitus) resultantes de distúrbios circulatórios, distúrbios circulatórios periféricos, como cãimbras.(2,3)","CONTRAINDICAÇÕES":"Contraindicado para menores de 12 anos, grávidas e a lactantes e pacientes com histórico de hipersensibilidade e alergia a qualquer um dos componentes do fitoterápico. Pacientes com coagulopatias ou em uso de anticoagulantes e antiagregantes plaquetários devem ser cuidadosamente monitorados.","PRECAUÇÕES DE USO":"O uso do G. biloba deve ser suspenso pelo menos três dias antes de procedimentos cirúrgicos.(3,4) Deve ser evitado em pacientes que apresentam crises convulsivas, principalmente se essas estiverem relacionadas com o uso de preparações com Ginkgo biloba.(5)","EFEITOS ADVERSOS":"Podem ocorrer distúrbios gastrointestinais, cefaleia e reações alérgicas cutâneas (hiperemia, edema e prurido).(4) Também foram relatados enjoos, palpitações, hemorragias e hipotensão.(6) Casos de hemorragia subaracnoidea, hematoma subdural, hemorragia intracerebral, hematoma subfrênico, hemorragia vítrea e sangramento pós-operatório foram relatados em pacientes que faziam uso de G. biloba isoladamente.(7,9)","INTERAÇÕES MEDICAMENTOSAS":"A associação desse medicamento com anticoagulantes, antiplaquetários, anti-inflamatórios não esteroidais (AINES) e/ou agentes trombolíticos pode aumentar o risco de hemorragias. Esse medicamento pode diminuir a efetividade dos anticonvulsivantes e pode alterar os efeitos da insulina, aumentando a sua depuração. Pode provocar mudanças no estado mental quando associado à buspirona ou ao Hypericum perforatum. Pode potencializar o efeito dos inibidores da monoaminaoxidase e pode aumentar o risco dos efeitos colaterais da nifedipina. Pode aumentar o risco de aparecimento da síndrome serotoninérgica quando associado aos inibidores da recaptação de serotonina e pode causar hipertensão arterial em uso concomitante com os diuréticos tiazídicos, segundo relato de caso.(7,8) A associação desse medicamento com omeprazol pode acarretar diminuição de nível sérico do omeprazol.(10) A associação com trazodona pode trazer risco de sedação excessiva.(11) O uso concomitante de G. biloba pode aumentar os riscos de eventos adversos causados pela risperidona, como, por exemplo, priapismo. (12) A associação com papaverina pode acarretar potencialização de efeitos terapêuticos e adversos.(13) Se o medicamento for administrado concomitantemente com anticoagulantes (ex. fenoprocoumon e varfarina) ou medicamentos antiplaquetários (por exemplo, clopidogrel, ácido acetilsalicílico e outros fármacos anti-inflamatórios não esteróides), o efeito pode ser influenciado.Os estudos disponíveis com varfarina não indicam que há uma interação entre varfarina e produtos de G. biloba, mas um acompanhamento adequado é aconselhável. Um estudo de interação com talinolol indicou que G. biloba pode inibir a P-glicoproteína intestinal. Isso pode dar origem a maior exposição dos fármacos marcadamente afetados pela P-glicoproteína no intestino, tais como etexilato de dabigatrano. Deve-se acompanhar a combinação de G. biloba e dabigatran. Não é recomendado o uso concomitante de preparações de G. biloba e efavirenz, pois há a diminuição plasmática por indução da atividade de CYP3A4.","FORMAS FARMACÊUTICAS":"Capsula e comprimido revestido contendo o extrato padronizado (extrato seco das folhas secas) contendo 22–27% de flavonoides glicosilados e 5–7% de lactonas terpênicas (constituídas por aproximadamente 2,8–3,4% de gingkolídeos A, B, e C, além de 2,6–3,2% de bilobalídeo). O teor de ácido ginkgólico é inferior a 5 mg/kg. Soluções para uso oral preparados com o extrato padronizado.(14) Ginkgo biloba L.","VIAS DE ADMINISTRAÇÃO E POSOLOGIA (DOSE E INTERVALO)":"Oral. Extrato seco: 120–240 mg diariamente, divididos em 2 ou 3 doses (40 mg de extrato equivale a 1,4-2,7g de folhas).(14) Extrato fluido (1:1): 0,5 mL, 3 vezes ao dia.(14)","TEMPO DE UTILIZAÇÃO":"Não foram encontrados dados descritos na literatura consultada sobre o tempo máximo de utilização. O tempo de uso depende da indicação terapêutica e da evolução do quadro acompanhada pelo profissional prescritor.","SUPERDOSAGEM":"Em caso de administração de quantidades acima das recomendadas, suspender o uso e manter o paciente em observação.","PRESCRIÇÃO":"Fitoterápico somente sob prescrição médica."}},{"scientific":"Glycine max (L.) Merr.","name":"Soja","id":9,"page":47,"fields":{"Família":"Leguminosae.(1)","Nomenclatura popular":"Soja.(2,3)","Parte utilizada/órgão vegetal":"Sementes.(2,4,5)","INDICAÇÕES TERAPÊUTICAS":"Esse fitoterápico é indicado como coadjuvante no alívio dos sintomas do climatério: sintomas vasomotores, tais como: ondas de calor e sudorese. É considerado modulador seletivo de receptores estrogênicos.(2,6)","CONTRAINDICAÇÕES":"Esse fitoterápico é contraindicado para menores de 12 anos. Pacientes com histórico de hipersensibilidade e alergia a qualquer um dos componentes do fitoterápico não devem fazer uso do mesmo.","PRECAUÇÕES DE USO":"Pode ocorrer reação alérgica cruzada com amendoim.(2) De acordo com a categoria de risco de fármacos destinados às mulheres grávidas, esse fitoterápico está incluído na categoria de risco C. Não há estudos disponíveis sobre a teratogenicidade de preparações com alta concentração de isoflavonas, bem como não há evidências científicas disponíveis sobre a segurança de seu uso durante a gestação e lactação, devendo seu emprego ser evitado nessas condições. Esse fitoterápico não deve ser utilizado por mulheres grávidas e em amamentação sem orientação médica.(2)","EFEITOS ADVERSOS":"O uso desse fitoterápico pode provocar distúrbios gastrointestinais leves como constipação, flatulência e náusea.(7) Nas doses diárias recomendadas, não foram relatadas reações adversas graves.(8)","INTERAÇÕES MEDICAMENTOSAS":"Evitar a associação desse fitoterápico com contraceptivos e outros medicamentos de ação estrogênica.(10) A efetividade do tamoxifeno pode ser diminuída por medicamentos à base de soja.(11) A proteína da soja pode reduzir a absorção de levotiroxina no trato digestivo, portanto não se deve tomar os dois medicamentos concomitantemente. É necessário aguardar 2 horas entre uma e outra tomada.(7) As isoflavonas genisteína e daidzeína podem bloquear a tireóide peroxidase e inibir a síntese de tiroxina. Pode ocorrer hipotireoidismo durante tratamentos prolongados.(12) O uso de medicamentos que alteram a microbiota intestinal, como os antibióticos, pode interferir no metabolismo das isoflavonas.(7)","FORMAS FARMACÊUTICAS":"Cápsulas contendo extrato de G. max: padronizado para conter no mínimo 400 mg em isoflavonas.(2)","VIAS DE ADMINISTRAÇÃO E POSOLOGIA (DOSE E INTERVALO)":"Oral. A dose diária deve estar entre 50 e 120 mg de isoflavonas.(6)","TEMPO DE UTILIZAÇÃO":"Não foram encontrados dados descritos na literatura consultada sobre o tempo máximo de utilização. O tempo de uso depende da indicação terapêutica e da evolução do quadro acompanhada pelo profissional prescritor.","SUPERDOSAGEM":"Não foram encontrados dados descritos na literatura consultada sobre problemas decorrentes de superdosagem. Em caso de ingestão de quantidades acima das recomendadas o paciente deve ser observado.","PRESCRIÇÃO":"Fitoterápico, isento de prescrição medica."}},{"scientific":"Harpagophytum procumbens DC. e Harpagophytum zeyheri Ihlenf. & H. Hartmann","name":"Garra-do-diabo","id":10,"page":51,"fields":{"Família":"Pedaliaceae.(1)","Nomenclatura popular":"Garra-do-diabo.(2)","Parte utilizada/órgão vegetal":"Raízes secundárias.(2)","INDICAÇÕES TERAPÊUTICAS":"Alívio de dores articulares moderadas e lombalgia aguda.(2)","CONTRAINDICAÇÕES":"A pacientes com cálculos biliares.(3) É contraindicado para menores de 18 anos, lactantes, grávidas e pacientes com histórico de hipersensibilidade e alergia a qualquer um dos componentes do fitoterápico.(4)","PRECAUÇÕES DE USO":"Dores articulares acompanhadas de edema das articulações, com eritema ou febre devem ser avaliadas pelo médico. Como precaução geral, pacientes com úlcera gástrica e duodenal, intestino irritável e litíase biliar não devem fazer uso desse fitoterápico. H. procumbens deve ser administrado com cautela a pacientes com afecções cardiovasculares.(4)","EFEITOS ADVERSOS":"Diarreia,(5) náusea, vômito, dor abdominal, cefaleia, tontura e reações alérgicas cutânea.(4) Se ocorrerem as reações adversas mencionadas acima, um médico deverá ser consultado.","INTERAÇÕES MEDICAMENTOSAS":"Não foram observados efeitos induzidos pelo extrato de H. procumbens sobre o sistema enzimático citocromo P-450, sugerindo ausência de interação com fármacos metabolizados por essa via.(6)","FORMAS FARMACÊUTICAS":"Cápsula e comprimido gastroresistentes contendo extrato seco padronizado (30 a 100 mg de harpagosídeo ou 45 a 150 mg de iridoides totais expressos em harpagosídeo).(2,7)","VIAS DE ADMINISTRAÇÃO E POSOLOGIA (DOSE E INTERVALO)":"Oral. Administrar 1-3 g de raízes ou quantidade equivalente de extrato aquoso ou hidroalcoólico.(3) Extrato mole (2,5-4,0:1; etanol 70% v/v): 10 mL; Extrato seco (1,5-2,5:1; água): 300 mg a 2,4 g, divididos em 2 a 3 doses diárias; Extrato seco (5-10:1; água): 600 a 800 mg, divididos em 2 a 3 doses diárias; Extrato seco (2,6-4: 1; etanol 30% v/v): 460 mg a 1,6 g, divididos em 2 a 4 doses diárias; Extrato seco (1,5-2,1:1; etanol 40% v/v): 600 mg a 2,7 g, divididos em 2 a 3 doses diárias; Extrato seco (3-5:1; etanol 60% v/v): 960 mg, dividido em 2 a 4 doses diárias; Extrato seco (3-6:1; etanol 80% v/v): 300 mg, dividido em 3 doses diárias; Extrato seco (6-12:1; de etanol 90% v/v): 90 mg, dividido em 2 doses diárias.(4)","TEMPO DE UTILIZAÇÃO":"Uso restrito a duas semanas.(4)","SUPERDOSAGEM":"Não foram encontrados dados descritos na literatura consultada sobre efeitos decorrentes de superdosagem. Em caso de administração acima das doses recomendadas, suspender o uso e manter o paciente em observação.","PRESCRIÇÃO":"Fitoterápico, isento de prescrição médica."}},{"scientific":"Hypericum perforatum L.","name":"Hipérico","id":11,"page":54,"fields":{"Família":"Hypericaceae.(1)","Nomenclatura popular":"Erva-de-são-joão, hipérico.(2)","Parte utilizada/órgão vegetal":"Planta inteira com parte aérea florida.(2,3)","INDICAÇÕES TERAPÊUTICAS":"Indicado para o tratamento dos estados depressivos leves a moderados.(4-17)","CONTRAINDICAÇÕES":"Pacientes com histórico de hipersensibilidade e alergia a qualquer um dos componentes do fitoterápico não devem fazer uso. Não usar em episódios de depressão grave. Esse fitoterápico é contraindicado para crianças abaixo de seis anos.(3) Não existem dados disponíveis sobre o uso de H. perforatum na gravidez e na lactação, porém há relatos que o extrato pode inibir a secreção de prolactina, portanto, não se recomenda seu uso em mulheres grávidas e lactantes.(3)","PRECAUÇÕES DE USO":"Deve evitar-se a exposição ao sol ou aos raios ultravioletas quando do uso desse fitoterápico, principalmente sem proteção, devido ao efeito fotossensibilizante de H. perforatum.(18) Não há restrições para o uso de H. perforatum por pessoas que operam veículos e máquinas.(19) A administração do fitoterápico deve ser cuidadosa em pacientes utilizando medicamentos de uso contínuo. Em casos de hipersensibilidade ao fitoterápico, recomenda descontinuar-se o uso e consultar um médico.(19) De acordo com a categoria de risco de fármacos destinados a mulheres grávidas, esse fitoterápico está incluído na categoria de risco C, ou seja, não foram realizados estudos em animais nem em mulheres grávidas; ou então, os estudos em animais revelaram risco, mas não existem estudos disponíveis realizados em mulheres grávidas. Portanto, esse fitoterápico não deve ser utilizado por mulheres grávidas sem orientação médica.(20)","EFEITOS ADVERSOS":"O uso de fitoterápicos à base de extratos de H. perforatum pode causar reações fotossensibilizantes.(21) Em casos raros, podem aparecer irritações gastrointestinais, reações alérgicas, fadiga e agitação.(7-17) Os extratos de H. perforatum são geralmente bem tolerados com incidência de reações adversas em torno de 0,2% dos casos avaliados em estudos clínicos. As reações adversas gastrointestinais podem ser minimizadas ao administrar o fitoterápico após as refeições.(7,10,17)","INTERAÇÕES MEDICAMENTOSAS":"É bem tolerado em uso clínico, mas há evidências de interações significativas com alguns fármacos: como ciclosporina, anticoagulantes cumarínicos, anticoncepcionais orais, teofilina, digoxina, indinavir e possivelmente outros inibidores da protease e transcriptase reversa, prejudicando os efeitos desses. Isso ocorre devido à indução pelo H. perforatum da via metabólica envolvendo o citocromo P-450.(19) A associação de H. perforatum com inibidores da MAO são contraindicados, assim como os inibidores seletivos da recaptação da serotonina, como a fluoxetina.(22) A combinação de H. perforatum com outros fármacos antidepressivos convencionais, tais como os antidepressivos tricíclicos ou fluoxetina, não é recomendada, exceto sob supervisão médica.(23) Há inúmeros relatos que possibilitam concluir que extratos de H. perforatum estimulam as enzimas hepáticas que realizam o metabolismo de drogas e podem reduzir os níveis séricos e eficácia terapêutica de outros medicamentos.(24-28) A coadministração de teofilina e extrato de H. perforatum reduziu o nível sérico de teofilina em paciente, requerendo aumento da dose.(24) A administração concomitante de H. perforatum e digoxina reduziu as concentrações séricas de digoxina após 10 dias de tratamento. (25) A diminuição das concentrações séricas de ciclosporina, varfarina e fenoprocumarina foi observada em pacientes que foram tratados concomitantemente com extratos de H. perforatum.(26) O uso concomitante de H. perforatum em cinco pacientes com inibidores da recaptação da serotonina resultou em sintomas de excesso de serotonina.(27) Foi divulgado um relatório sobre a interação significativa de drogas com o H. perforatum e indinavir, inibidor da protease, usado para tratar infecções por HIV.(28) O H. perforatum reduziu substancialmente as concentrações plasmáticas de indinavir, devido à indução da via metabólica do citocromo P-450. Como consequência, a utilização concomitante de H. perforatum e inibidores da protease ou inibidores de transcriptase reversa não-nucleosideos não Hypericum perforatum L. é recomendada, e pode resultar em concentrações sub-terapêuticas de drogas anti-retrovirais, levando à perda da atividade virucida e o desenvolvimento de resistência.(28)","FORMAS FARMACÊUTICAS":"Cápsulas e comprimidos contendo extrato seco e tintura.(18,29,30)","VIAS DE ADMINISTRAÇÃO E POSOLOGIA (DOSE E INTERVALO)":"Oral. Uso adulto: 0,8 a 1,2 mL da tintura 3 vezes ao dia. Extrato seco (300 mg, 3 vezes ao dia).(5,7,8,13,17,18)","TEMPO DE UTILIZAÇÃO":"Tal como acontece com outras drogas antidepressivas, a observação dos efeitos terapêuticos de H. perforatum podem requerer 2-4 semanas de tratamento.(18)","SUPERDOSAGEM":"Tratamentos com raios ultravioleta ou exposição prolongada à luz solar devem ser evitados durante o tratamento com H. perforatum, devido à ocorrência de fotossensibilização em indivíduos sensíveis a luz.(18) Em animais, foi observado aumento da fotossensibilidade. Se ocorrer superdosagem em seres humanos, deve-se proteger a pele dos raios solares ou ultravioleta por duas semanas. Porém, caso ocorra ingestão de doses excessivas, deve-se provocar o esvaziamento gástrico logo após o acidente. Em doses maciças, foram relatadas alterações do ritmo cardíaco, da visão, depressão, estados de confusão mental, alucinação e psicose. Em caso de superdosagem, suspender o uso e procurar orientação médica de imediato.(19)","PRESCRIÇÃO":"Fitoterápico, somente sob prescrição médica."}},{"scientific":"Lippia sidoides Cham.","name":"Alecrim-pimenta","id":12,"page":58,"fields":{"Família":"Verbenaceae.(1)","Nomenclatura popular":"Alecrim-pimenta, alecrim-bravo.(2,3,4)","Parte utilizada/órgão vegetal":"Folhas e flores.(2)","INDICAÇÕES TERAPÊUTICAS":"Anti-inflamatório, antisséptico da cavidade oral, afecções da pele e couro cabeludo. Antisséptico tópico, antimicótico e escabicida.(2)","CONTRAINDICAÇÕES":"A infusão não deve ser usada em inalações devido à ação irritante dos componentes voláteis. Não usar a tintura em gestantes, em lactantes, crianças menores de dois anos, alcoolistas e diabéticos. O sabonete líquido é contraindicado para pessoas com problemas de hipersensibilidade ao fitoterápico.(2)","PRECAUÇÕES DE USO":"Não engolir o produto após o bochecho e gargarejo. (2) Manter fora do alcance de crianças.","EFEITOS ADVERSOS":"A infusão pode provocar suave sensação de ardor na boca e alterações no paladar. A aplicação tópica da tintura pode provocar ardência.(2)","INTERAÇÕES MEDICAMENTOSAS":"Não foram encontrados dados descritos na literatura consultada.","FORMAS FARMACÊUTICAS":"Infusão (2-3 g), tintura (1:5, etanol 70%),(2) colutório à base do óleo essencial,(5-12) gel contendo óleo essencial e gel-creme contendo óleo essencial e sabonete líquido.(2,13-20, 21)","VIAS DE ADMINISTRAÇÃO E POSOLOGIA (DOSE E INTERVALO)":"Uso externo Infuso (2-3 colheres de chá em 150 mL de água): fazer bochechos e/ou gargarejos duas a três vezes ao dia. Tintura: após higienização, aplicar 10 mL da tintura diluída em 75 mL de água, com auxílio de algodão, três vezes ao dia. Fazer bochechos ou gargarejos com 10 mL da tintura diluída em 75 mL de água, três vezes ao dia. Gel: aplicar nas áreas afetadas de uma a três vezes ao dia. Sabonete líquido: durante o banho, aplicar na área afetada, deixando o sabonete em contato por 10 minutos. Lavar com água corrente.(2)","TEMPO DE UTILIZAÇÃO":"O uso foi considerado seguro para enxaguatórios, géis e colutórios com até 10% de óleo essencial em períodos de 7 a 30 dias, de três meses e um ano. (5,6,10,19,22)","SUPERDOSAGEM":"Não foram encontrados dados descritos na literatura consultada sobre problemas decorrentes de superdosagem. Em caso de administração de quantidades acima das recomendadas, suspender o uso e manter o paciente sob observação.","PRESCRIÇÃO":"Fitoterápico, isento de prescrição médica."}},{"scientific":"Matricaria chamomilla L.","name":"Camomila","id":13,"page":63,"fields":{"Família":"Asteraceae.(1)","Nomenclatura popular":"Camomila, matricária, maçanilha.(2)","Parte utilizada/órgão vegetal":"Inflorescências.(3,4)","INDICAÇÕES TERAPÊUTICAS":"Antiespasmódico, ansiolítico e sedativo leve. Antiinflamatório em afecções da cavidade oral.(4)","CONTRAINDICAÇÕES":"A gestantes devido à atividade emenagoga e relaxante da musculatura lisa.(5) Pacientes com hipersensibilidade ou alergia a plantas da família Asteraceae.","PRECAUÇÕES DE USO":"Não há informações sobre precauções gerais e relacionadas a possíveis efeitos teratogênicos, na amamentação ou uso pediátrico. Relatos sobre segurança e eficácia durante a gestação não estão disponíveis.(6)","EFEITOS ADVERSOS":"A presença de lactonas sesquiterpênicas nas flores de camomila poderá desencadear reações alérgicas em indivíduos sensíveis, e tem sido descrita dermatite de contato para algumas preparações contento camomila.(7-9) Poucos casos de alergia foram atribuídos especificamente a camomila.(10) Um caso de reação anafilática por ingestão de flores de camomila foi registrado.(11-13)","INTERAÇÕES MEDICAMENTOSAS":"Uso interno Foram descritas interações com varfarina, estatinas e contraceptivos orais.(6,14)","FORMAS FARMACÊUTICAS":"Infuso.(19) Cápsula ou comprimido contendo extrato seco (padronizado em 1,2% de apigenina).(15) Extrato fluido (1:1): em solução hidroetanólica a 45%.(15,16)","VIAS DE ADMINISTRAÇÃO E POSOLOGIA (DOSE E INTERVALO)":"Oral. Administrar 150 mL do infuso (5-10 min após o preparo), 3-4 vezes entre as refeições (acima de 12 anos).(4) Administrar 1-4 mL do extrato fluido para adultos (3 vezes ao dia) ou 0,6-2 mL em dose única (crianças maiores que 3 anos). Não utilizar em crianças menores de 3 anos.(15,16) Bochechos e/ou gargarejos: administrar o infuso (5- 10 minutos após o preparo), 3 vezes ao dia.(4) Uso externo Tópica. Compressas: utilizar a infusão preparada com 30-100 g de droga vegetal em 1000 mL de água.(16) Infuso: 6-9 g em 150 mL ou 30-100 g em 1000 mL.(4,16)","TEMPO DE UTILIZAÇÃO":"Não foram encontrados dados descritos na literatura consultada sobre o tempo máximo de utilização. O tempo de uso depende da indicação terapêutica e da evolução do quadro acompanhada pelo profissional prescritor.","SUPERDOSAGEM":"Não foram encontrados dados descritos na literatura consultada sobre problemas decorrentes de superdosagem. Em caso de ingestão de quantidades acima das recomendadas o paciente deve ser observado.","PRESCRIÇÃO":"Fitoterápico isento de prescrição médica."}},{"scientific":"Maytenus ilicifolia Mart. ex Reissek e Maytenus aquifolia Mart.","name":"Espinheira-santa","id":14,"page":66,"fields":{"Família":"Celastraceae.(1)","Nomenclatura popular":"Espinheira-santa.(2,3,4)","Parte utilizada/órgão vegetal":"Folhas.(2,4)","INDICAÇÕES TERAPÊUTICAS":"Antidispéptico, antiácido e protetor da mucosa gástrica.(2,4)","CONTRAINDICAÇÕES":"Não deve ser usado durante a gravidez, lactação(2,4) e em crianças menores de seis anos.(4) Há indícios que o uso de espinheira-santa causa redução do leite materno.(5) O uso interno da espinheira-santa é contraindicado durante a lactação.","PRECAUÇÕES DE USO":"Não deve ser usado durante a gravidez e lactação. (2,4) Suspender o uso quando da realização de exames de medicina nuclear.(6,7)","EFEITOS ADVERSOS":"Alguns casos raros de hipersensibilidade são descritos.(4) Não foram relatados, até o momento, efeitos adversos graves ou que coloquem em risco a saúde dos pacientes utilizando extratos de M. ilicifolia nas doses recomendadas. Raramente, podem ocorrer casos de hipersensibilidade. Nesse caso, deve ser suspenso o uso e acompanhado o paciente.(8) Nos estudos clínicos realizados foram descritos um caso de aumento do apetite com o uso do medicamento e um relato de mal estar indefinido, boca seca, gosto estranho na boca, náusea, tremor nas mãos e poliúria, mas isso ocorreu em sujeitos de pesquisa que receberam dosagens até 10 vezes maior que a usual humana.(8,9) No estudo foi descrito redução do leite materno.(10)","INTERAÇÕES MEDICAMENTOSAS":"Nenhum estudo foi desenvolvido avaliando a interação de extratos de M. ilicifolia com medicamentos. A legislação brasileira não recomenda a administração concomitante de M. ilicifolia com bebidas alcoólicas e outros medicamentos.(11) Compostos polifenólicos podem ser precursores de quinonas ou de intermediários quinonametídeos que são inativadores das CYP.(12) Da mesma forma, a pristimerina, um triterpenoide quinonametídeo também pode agir como inibidor da CYP alterando o efeito de diversos medicamentos.(13) Testes ex vivo mostraram que quercetina, kaempferol e outros compostos fenólicos podem modular a atividade da PgP (Fosfoglicolato fosfatase), alterando o metabolismo de outros medicamentos. Assim, plantas medicinais que os contenham devem ser evitadas por usuários de polifarmácia.(6) Pode ocorrer interação com esteróides anabolizantes, metotrexato, amiodarona e cetoconazol, por possível dano hepático, e com imunossupressores por apresentar efeitos antagonistas.(7)","FORMAS FARMACÊUTICAS":"Cápsulas ou comprimidos contendo extrato seco. (4) Infuso: 3 g de folhas secas em 150 mL de água (q.s.p.).(2)","VIAS DE ADMINISTRAÇÃO E POSOLOGIA (DOSE E INTERVALO)":"Oral.Uso adulto e infantil acima de 12 anos. Extrato seco: tomar 860 mg de duas a três vezes ao dia.(4) Infuso: 3 g para 150 mL. Tomar 150 mL do infuso, logo após o preparo, três a quatro vezes ao dia.(2)","TEMPO DE UTILIZAÇÃO":"Não foram encontrados dados descritos na literatura consultada sobre o tempo máximo de utilização. O tempo de uso depende da indicação terapêutica e da evolução do quadro acompanhada pelo profissional prescritor. Estudo clínico avaliado propõe a utilização por 28 dias.(9)","SUPERDOSAGEM":"Não há relatos de intoxicações por superdosagem de M. officinalis. Plantas ricas em fenóis totais, como a M. ilicifolia, quando usadas em doses excessivas, podem causar irritação da mucosa gástrica e intestinal, gerando vômitos, cólicas intestinais e diarreia.(14) Maytenus ilicifolia Mart.ex Reissek e Maytenus aquifolia Mart.","PRESCRIÇÃO":"Fitoterápico isento de prescrição médica."}},{"scientific":"Passiflora incarnata L.","name":"Maracujá","id":15,"page":71,"fields":{"Família":"Passifloraceae Juss. ex Roussel.(1)","Nomenclatura popular":"Maracujá, flor da paixão, maracujá doce.(2,3)","Parte utilizada/órgão vegetal":"Folhas.(4)","INDICAÇÕES TERAPÊUTICAS":"Ansiolítico e sedativo leve.(4)","CONTRAINDICAÇÕES":"Seu uso é contraindicado durante a gravidez. Não utilizar em casos de tratamento com sedativos e depressores do sistema nervoso.(4)","PRECAUÇÕES DE USO":"Seu uso não é recomendado em gestantes; lactantes; alcoolistas e diabéticos. Crianças de três a 12 anos devem passar por orientação médica. Seu uso pode causar sonolência.(4) Não utilizar em caso de tratamento com medicamentos depressores do sistema nervoso central.(5-10) Seu uso pode causar sonolência, não utilizar cronicamente.(4) Pode ocorrer sonolência durante o tratamento. Nesse caso o paciente não deverá dirigir veículos ou operar máquinas, já que a habilidade e atenção podem ficar reduzidas.(11)","EFEITOS ADVERSOS":"Existem casos clínicos relatados de hipersensibilidade,(12) asma ocupacional mediada por IgE e rinite. (13) Doses elevadas poderão causar estados de sonolência excessiva.","INTERAÇÕES MEDICAMENTOSAS":"Esse fitoterápico potencializa os efeitos sedativos do pentobarbital e hexobarbital, aumentando o tempo de sono de pacientes. Há indícios de que as cumarinas presentes na espécie vegetal apresentam ação anticoagulante potencial e possivelmente interagem com varfarina.(14) O uso desse fitoterápico associado a drogas inibidoras da monoamino oxidase (isocarboxazida, fenelzina e tranilcipromina) pode potencializar o efeito.(15)","FORMAS FARMACÊUTICAS":"Planta fresca (in natura), droga vegetal (encapsulada),(4) extrato fluido e tintura.(3)","VIAS DE ADMINISTRAÇÃO E POSOLOGIA (DOSE E INTERVALO)":"Oral. Para adolescentes e adultos: infusão da droga vegetal - 1-2 g em 150 mL de água fervente, tomar 1-4 vezes por dia (10 a 15 minutos após o preparo). Droga vegetal encapsulada – 0,5-2 g, 1-4 vezes por dia.(16) Extrato fluido (1:1 em álcool etílico 25%) - 0,5 a 1,0 mL, 3 vezes ao dia.(4) Tintura (1:8 em álcool 45%) - 0,5 a 2,0 mL, 3 vezes ao dia.(17) A posologia recomendada para adultos é de 3-5 vezes ao dia, e para adolescentes de 3 vezes ao dia.(16) A dose do extrato seco deverá corresponder à posologia das formas acima descritas.","TEMPO DE UTILIZAÇÃO":"Caso os sintomas persistam acima de duas semanas durante o uso do medicamento, um médico deverá ser procurado.","SUPERDOSAGEM":"Em caso de superdosagem, suspender o uso e procurar orientação médica de imediato. Alguns dos sintomas são: sedação, diminuição da atenção e dos reflexos.","PRESCRIÇÃO":"Fitoterápico isento de prescrição medica."}},{"scientific":"Paullinia cupana Kunth","name":"Guaraná","id":16,"page":75,"fields":{"Família":"Sapindaceae.(1)","Nomenclatura popular":"Guaraná.(2)","Parte utilizada/órgão vegetal":"Sementes.(2)","INDICAÇÕES TERAPÊUTICAS":"Astenia e como psicoestimulante.(2)","CONTRAINDICAÇÕES":"Contraindicado para pacientes com distúrbios cardiovasculares, hipertensão arterial, arritmia cardíaca, gastrite, úlcera péptica, úlcera duodenal, cólon irritável, afecções renais, hipertireoidismo, cirrose hepática e predisposição à espasmos musculares. É contraindicado para crianças e pacientes com histórico de hipersensibilidade e alergia a qualquer um dos componentes do fitoterápico.(3)","PRECAUÇÕES DE USO":"Seu uso é desaconselhado a pacientes que apresentem desordens psíquicas como pânico, agitação, ansiedade e insônia. Em pacientes com epilepsia ou disritmia cerebral. Não deve ser utilizado em pacientes com distúrbios da coagulação ou sob tratamento com anticoagulantes. Não associar a bebidas que contenham metilxantinas (café, chá, achocolatados, refrigerantes a base de extrato de cola e de guaraná e mate), para não potencializar os efeitos desse fitoterápico.(4)","EFEITOS ADVERSOS":"As metilxantinas, constituintes principais de extratos de P. cupana, pela estimulação direta do músculo cardíaco, podem causar aumento da frequência cardíaca e arritmias. Além disso, podem produzir irritação gástrica e aumento da diurese.(5) Os efeitos adversos desse fitoterápico, devidos à cafeína, são geralmente leves e transitórios, embora frequentes. Sob o ponto de vista psiquiátrico, a cafeína pode exacerbar estados ansiosos e contribuir para distúrbios do sono. Devido à presença das metilxantinas, seu uso contínuo pode causar dependência. O uso excessivo desse fitoterápico também pode levar a hipocalcemia (diminuição de cálcio) e hipocalemia (diminuição de potássio), devido à sua ação diurética.(5)","INTERAÇÕES MEDICAMENTOSAS":"Esse fitoterápico potencializa a ação de analgésicos e, quando administrado com anticoagulantes, inibe a agregação de plaquetas aumentando o risco de sangramento.(6) Esse fitoterápico pode levar à hipocalcemia e, consequentemente, à toxicidade da digoxina. O etinilestradiol pode potencializar o efeito da cafeína, enquanto que a cimetidina potencializa seu efeito e também sua toxicidade.","FORMAS FARMACÊUTICAS":"Cápsulas ou comprimidos contendo extrato seco (250 mg de extrato padronizado em cafeína).","VIAS DE ADMINISTRAÇÃO E POSOLOGIA (DOSE E INTERVALO)":"Oral. Ingerir 2 cápsulas pela manhã e 1 a 2 cápsulas após o almoço. Sua administração à noite pode causar insônia. A administração desse fitoterápico deve ser realizada de forma descontinuada.","TEMPO DE UTILIZAÇÃO":"O tratamento não deve ultrapassar um mês, sendo necessário um período de duas semanas de interrupção do tratamento antes de seu reinício.","SUPERDOSAGEM":"Doses excessivas desse fitoterápico podem causar vômitos, cólicas abdominais, convulsões e arritmias, havendo necessidade de cuidados intensivos. Deve-se proceder à lavagem gástrica ou emese. Pode-se administrar carvão ativado ou sorbitol para retardar a absorção do fitoterápico. Em caso de administração acima do recomendado, suspender o uso e manter o paciente sob observação.","PRESCRIÇÃO":"Fitoterápico, isento de prescrição médica."}},{"scientific":"Peumus boldus Molina","name":"Boldo","id":17,"page":78,"fields":{"Família":"Monimiaceae.(1)","Nomenclatura popular":"Boldo-do-chile, boldo-verdadeiro.(2,3)","Parte utilizada/órgão vegetal":"Folhas.(2,3,4)","INDICAÇÕES TERAPÊUTICAS":"Indicado como colagogo, colerético e nas dispepsias funcionais.(3)","CONTRAINDICAÇÕES":"Contraindicado para menores de 6 anos se pacientes com histórico de hipersensibilidade e alergia a qualquer um dos componentes do fitoterápico. (5) Contraindicado nos casos de obstrução das vias biliares, cálculos biliares, infecções ou câncer de ducto biliar e câncer de pâncreas, devido aos efeitos colagogo e colerético.(6) Pacientes com quadro de afecções severas no fígado, como hepatite viral, cirrose e hepatite tóxica não deverão fazer uso desse fitoterápico.(6) Esse produto não deve ser usado durante a gravidez, devido a presença do alcaloide esparteína, que tem atividade ocitóxica.(7) Mulheres em período de lactância não deverão fazer uso desse fitoterápico, devido à presença de alcaloides e risco de neurotoxicidade.(5)","PRECAUÇÕES DE USO":"Não ingerir doses maiores do que as recomendadas. O uso desse fitoterápico não deve ultrapassar quatro semanas consecutivas. Esse fitoterápico não deve ser utilizado por lactantes e mulheres grávidas sem orientação médica.(4)","EFEITOS ADVERSOS":"Nas doses recomendadas não são conhecidos efeitos adversos ao fitoterápico. Doses acima das recomendadas causam irritação nas vias urinárias, vômitos e diarreia.(4)","INTERAÇÕES MEDICAMENTOSAS":"Não foram encontrados dados descritos na literatura consultada sobre as interações medicamentosas com fitoterápicos à base de P. boldus.","FORMAS FARMACÊUTICAS":"Infuso.(2) Cápsulas ou comprimidos contendo extrato seco.(4)","VIAS DE ADMINISTRAÇÃO E POSOLOGIA (DOSE E INTERVALO)":"Oral. Uso adulto e infantil acima de 12 anos. Infuso obtido com 1 a 2g da droga em 150 mL de água. Tomar 150 mL do infuso, 10 a 15 minutos após o preparo, duas vezes ao dia.(2) Extrato seco,50-100 mg/dose, duas a três vezes ao dia.(9)","TEMPO DE UTILIZAÇÃO":"O uso desse fitoterápico não deve ultrapassar quatro semanas consecutivas.","SUPERDOSAGEM":"Doses superiores às recomendadas poderão provocar distúrbios urinários, vômitos e diarreia. Em caso de superdosagem, suspender o uso e procurar orientação médica de imediato.","PRESCRIÇÃO":"Fitoterápico, isento de prescrição médica."}},{"scientific":"Piper methysticum G. Forst","name":"Kava-kava","id":18,"page":81,"fields":{"Família":"Piperaceae.(1)","Nomenclatura popular":"Kava-kava.(2)","Parte utilizada/órgão vegetal":"Rizoma. (2)","INDICAÇÕES TERAPÊUTICAS":"Indicado para o tratamento sintomático de estágios leves a moderados de ansiedade e insônia, em curto prazo (1-8 semanas de tratamento).(3-12)","CONTRAINDICAÇÕES":"Durante a gravidez e lactação, e em pacientes com depressão endógena ou afecções hepáticas. Vários casos de toxicidade hepática foram relatados na Europa após uso de produtos à base de plantas contendo extratos de P. methysticum.(4,13) É contraindicado para pacientes com afecções hepáticas (hepatite, cirrose, icterícia e outros) e/ou que utilizam medicamentos que possam causar hepatotoxicidade, tais como acetaminofeno, inibidores da HMG-CoA redutase, isoniazida, metotrexato, entre outros. Esse fitoterápico é contra indicado para menores de 12 anos, e para lactantes.","PRECAUÇÕES DE USO":"P. methysticum não deve ser administrado por mais de 3 meses sem orientação médica. Mesmo quando administrado no intervalo de dosagem recomendada, reflexos motores e a capacidade de dirigir ou operar máquinas pesadas podem ser prejudicados.(4)","EFEITOS ADVERSOS":"Estudo de farmacovigilância envolvendo 4.049 pacientes que receberam extrato padronizado de P. methysticum contendo 70% de kavapironas (extrato 150 mg, equivalente a 105 mg kavapironas) por via oral/dia durante sete semanas, reações adversas foram relatadas em 61 pacientes (1,5%). As principais reações foram queixas gastrointestinais ou reações alérgicas cutâneas.(9,14) Em estudo com 3.029 pacientes que receberam extrato padronizado de P. methysticum com 30% de kavapironas (800 mg de extrato, equivalente a 240 mg kavapironas) por via oral/dia durante 4 semanas, reações adversas foram relatadas em 2,3% dos pacientes. Foram relatados casos de reações alérgicas, de queixas gastrointestinais, de cefaleia ou tonturas, e de outros problemas indefinidos.(14, 25) A administração crônica do rizoma ou suas preparações podem causar coloração amarelada transitória da pele e unhas, reversível após a descontinuação da droga.(4) Excesso e abuso crônico de infusões do rizoma têm sido historicamente associados à dermopatia escamosa e eruptiva de etiologia desconhecida.(15) Reações alérgicas da pele e ictiose também foram relatadas.(16-18) Em duas pacientes, a reação foi observada em áreas ricas em glândulas sebáceas, sendo que fizeram uso por 3 semanas em terapia antidepressiva sistêmica com o rizoma. A reação resultou na formação de pápulas e placas na face ventral e dorsal do tórax.(19) Estudo em uma comunidade aborígene australiana demonstrou que o abuso crônico do rizoma de kava levou à desnutrição e perda de peso, aumento dos níveis de γ-glutamil transferase, diminuição dos níveis de proteína do plasma, e redução do volume de plaquetas e número de linfócitos.(20) Em voluntários saudáveis, distúrbios da acomodação visual, e distúrbios no equilíbrio oculomotor, foram notificados após a ingestão de grandes doses de kava. (21) O consumo crônico (6 meses) de grandes quantidades da infusão do rizoma (5-6 xícaras/dia) tem sido relatado como causador de anorexia, diarreia e distúrbios visuais.(17) Um relato de caso de atetose envolvendo membros, tronco, pescoço e da musculatura facial, com atetose acentuada da língua, foi associado ao consumo crônico de grandes quantidades do rizoma de kava.(22,23)","INTERAÇÕES MEDICAMENTOSAS":"A eficácia de medicamentos e drogas de ação central, tais como álcool, barbitúricos e outros psicofármacos pode ser potencializada.(4) Foi relatada a interação medicamentosa entre P. methysticum, alprazolam, cimetidina e terazosina.(24)","FORMAS FARMACÊUTICAS":"Cápsulas ou comprimidos contendo a droga vegetal e extratos secos para uso oral.(4) Piper methysticum G. Forst","VIAS DE ADMINISTRAÇÃO E POSOLOGIA (DOSE E INTERVALO)":"Oral. Dose diária: droga vegetal ou extratos, equivalente a 60–210 mg de kavapironas ou 100 mg do extrato padronizado (70% de kavapironas), três vezes ao dia; na concentração de 30%, a dose é de 200 mg três vezes ao dia.(4,7,10-12,25)","TEMPO DE UTILIZAÇÃO":"O tempo de uso depende da indicação terapêutica e da evolução do quadro acompanhada pelo médico.","SUPERDOSAGEM":"Os sintomas de intoxicação após uso de altas doses de P. methysticum são: ataxia, desequilíbrio, distúrbios da fala, fadiga e sonolência, dificuldade de acomodação visual, dilatação das pupilas, distúrbios do balanço oculomotor, problemas articulares, perda de apetite e de peso e ressecamento da pele acompanhado de coloração amarelada. Adicionalmente, foram descritas reações paradoxais com potencialização da ansiedade e ocorrência de lesões hepáticas irreversíveis após superdosagem. A utilização de altas doses de P. methysticum foi relacionada ao aumento dos níveis de γ-glutamil transferase (GGT). Em caso de superdosagem, suspender a medicação imediatamente.(26) Recomenda-se tratamento de suporte sintomático pelas medidas habituais de apoio e controle das funções vitais. Na superdosagem aguda, o tratamento deve ser instituído com passagem de sonda nasogástrica seguida de esvaziamento e lavagem gástrica. Os sintomas de superdosagem melhoram com a interrupção da administração de P. methysticum. Se ocorrer eritema ou edema em extensas áreas, pode ser necessário o uso de corticoides.","PRESCRIÇÃO":"Fitoterápico, somente sob prescrição médica."}},{"scientific":"Psidium guajava L.","name":"Goiabeira","id":19,"page":85,"fields":{"Família":"Myrtaceae.(1)","Nomenclatura popular":"Goiabeira.(2)","Parte utilizada/órgão vegetal":"Ramos novos, com folhas jovens.(4)","INDICAÇÕES TERAPÊUTICAS":"Tratamento da diarreia aguda não infecciosa e enterite por rotavirus.(4,21,22,23,24)","CONTRAINDICAÇÕES":"Hipersensibilidade ou alergia à droga vegetal.(4)","PRECAUÇÕES DE USO":"Não exceder a dose recomendada ou a duração do tratamento.(5)","EFEITOS ADVERSOS":"Alergia aos componentes do fitoterápico.(4)","INTERAÇÕES MEDICAMENTOSAS":"Não foram encontrados dados descritos na literatura consultada.","FORMAS FARMACÊUTICAS":"Cápsulas ou comprimidos contendo a droga vegetal ou extrato seco, e infuso.(4)","VIAS DE ADMINISTRAÇÃO E POSOLOGIA (DOSE E INTERVALO)":"Uso interno Oral. Para diarreia: 500 mg da droga vegetal em pó (folha) três ou quatro vezes ao dia.(4) Extrato seco 250 a 350 mg de 3 a 4 vezes por dia.(20) Tomar uma dose de 150 mL do infuso de duas a três vezes ao dia.(4)","TEMPO DE UTILIZAÇÃO":"Não exceder a dosagem recomendada ou a duração do tratamento.(14)","SUPERDOSAGEM":"Suspender o uso e manter o paciente sob observação.","PRESCRIÇÃO":"Fitoterápico, isento de prescrição médica"}},{"scientific":"Rhamnus purshiana DC.","name":"Cáscara-sagrada","id":20,"page":88,"fields":{"Família":"Rhamnaceae.(1,2)","Nomenclatura popular":"Cáscara-sagrada.(1,3)","Parte utilizada/órgão vegetal":"Cascas secas. A casca fresca contém antronas livres e deve ser seca por pelo menos 1 ano ou envelhecida artificialmente por calor ou aeração antes da utilização terapêutica.(2,3,4)","INDICAÇÕES TERAPÊUTICAS":"Indicado para tratamento de curto prazo da constipação intestinal ocasional.(5,6,7,8)","CONTRAINDICAÇÕES":"Não deve ser administrado a pacientes com obstrução intestinal e estenose, atonia, doenças inflamatórias do cólon (colite ulcerosa, síndrome do intestino irritável, doença de Crohn), apendicite, desidratação grave e depleção de eletrólitos ou constipação intestinal crônica.(7,9) Tal como acontece com outros laxantes estimulantes, a cáscara sagrada é contraindicada em pacientes com dores, cólicas, hemorroidas, nefrite ou quaisquer sintomas de distúrbios abdominais não diagnosticados, como dor, náuseas ou vômitos.(10) Contraindicado para menores de 10 anos, grávidas,(11,12) lactantes,(12) nos casos de insuficiência hepática, renal e cardíaca e pacientes com histórico de hipersensibilidade e alergia a qualquer um dos componentes do fitoterápico.(7)","PRECAUÇÕES DE USO":"A cáscara-sagrada e outros laxantes contendo glicosídeos antraquinônicos não devem ser utilizados de forma contínua por mais de 1-2 semanas, devido ao risco de desequilíbrio eletrolítico.(10)","EFEITOS ADVERSOS":"Doses únicas de cáscara-sagrada podem resultar em cãimbras, e desconforto do trato gastrointestinal, o que pode necessitar de redução da dosagem.(8) A sobredosagem pode conduzir à espasmos abdominais, cólicas e dor, bem como a formação de fezes aquosas. Abuso de laxantes a longo prazo pode levar a desequilíbrio eletrolítico (hipocalemia e hipocalcemia), acidose metabólica, má absorção de nutrientes, perda de peso, albuminúria e hematúria.(13,14)","INTERAÇÕES MEDICAMENTOSAS":"O trânsito intestinal acelerado pode resultar na absorção reduzida de fármacos administrados oralmente.(15) O desequilíbrio eletrolítico causado pelo uso de cáscara-sagrada, tais como hipocalemia (redução do potássio sérico), pode potenciar os efeitos dos glicosídeos cardiotônicos (por exemplo, digoxina, digitálicos ou estrofantina). A hipocalemia resultante do abuso de laxantes a longo prazo também pode potencializar os efeitos de fármacos antiarrítmicos (por exemplo, quinidina), provocando mudanças do ritmo cardíaco por afetar os canais de potássio. A hipocalemia causada por fármacos como diuréticos tiazídicos, aadrenocorticosteroides ou raiz de alcaçuz pode ser acentuada, e o desequilíbrio eletrolítico poderá ser agravado.(8)","FORMAS FARMACÊUTICAS":"Cápsulas e comprimidos contendo a droga vegetal, na forma de pó, ou extratos secos. Tintura, extrato fluido, outras preparações líquidas e sólidas, devem ser guardadas em recipientes resistentes a luz e hermeticamente fechados.(2,16,17)","VIAS DE ADMINISTRAÇÃO E POSOLOGIA (DOSE E INTERVALO)":"Oral. Droga vegetal: de 0,3 a 1,0 g em dose única diária. Extrato seco: de 57 a 108 mg em dose única diária. Todas as preparações padronizadas para conter 20-30 mg de derivados hidroxiantracênicos calculados como cascarosídeo A. Administrar preferencialmente ao deitar, ou em duas doses divididas, uma de manhã e uma à noite, ao deitar.(7,8,22)","TEMPO DE UTILIZAÇÃO":"Não deve ultrapassar mais de 2 semanas, devido ao risco de desequilíbrio eletrolítico.(10)","SUPERDOSAGEM":"Os principais sintomas de sobredosagem de laxantes antraquinônicos são cólicas intestinais e diarreia severa com consequente perda de fluidos e eletrólitos. O tratamento da superdosagem deve ser baseado na reposição de eletrólitos. Os níveis de Rhamnus purshiana DC. eletrólitos devem ser monitorados, particularmente o de potássio, principalmente em idosos e jovens.(10) A ingestão crônica e em altas doses de produtos contendo antranóides poderá desencadear um quadro de hepatite tóxica.(17)","PRESCRIÇÃO":"Fitoterápico, isento de prescrição médica."}},{"scientific":"Senna alexandrina Mill.","name":"Sene","id":21,"page":91,"fields":{"Família":"Leguminosae.(1)","Nomenclatura popular":"Sene, sena.(2)","Parte utilizada/órgão vegetal":"Folhas e frutos.(2)","INDICAÇÕES TERAPÊUTICAS":"Tratamento de constipação intestinal ocasional.(2-7)","CONTRAINDICAÇÕES":"Contraindicado para menores de 12 anos, grávidas e lactantes e pacientes com histórico de hipersensibilidade e alergia a qualquer um dos componentes do fitoterápico.(2,3,5,6,8) Não deve ser utilizado em casos de constipação intestinal crônica,(2) distúrbios intestinais, tais como obstrução e estenose intestinal, atonia, doenças inflamatórias intestinais (doença de Crohn, colite ulcerativa, colopatias inflamatórias) e dores abdominais,(2,4,6) desidratação severa,(2,5) hemorroidas, apendicite, hipocalemia, doença inflamatória pélvica, período menstrual, cistite, insuficiência hepática, renal ou cardíaca.(3,8) Contraindicado para pacientes com náuseas, vômito ou quando algum sintoma agudo ou crônico não diagnosticado estiver presente.(2)","PRECAUÇÕES DE USO":"Em caso de hipersensibilidade ao produto, recomenda-se descontinuar o uso e consultar o médico.(2) Sangramento retal ou insuficiência de peristalse, decorrentes do uso prolongado, podem indicar condições graves.(9,2) Metabólitos ativos, por exemplo, reinantronas, passam para o leite materno em pequenas quantidades. Em experiências com animais concluiu-se que a passagem de reinantronas através da placenta é baixa.(5) Esse fitoterápico não deve ser utilizado por mulheres grávidas sem orientação médica.(2,10)","EFEITOS ADVERSOS":"O uso da S. alexandrina pode ocasionar desconforto no trato gastrointestinal, com presença de espasmos e cólicas abdominais.(2,3,4,6,8) Nesse caso diminuir a dose.(6) As antraquinonas podem alterar a cor da urina para amarela escura ou marrom avermelhada, o que desaparece com a suspensão do uso do fitoterápico.(2,3) A pseudomelanosis coli (acúmulo de macrófagos pigmentados no interior da submucosa intestinal) pode ocorrer após o uso prolongado,(5,11) é inofensiva e desaparece com a descontinuação do fitoterápico.(2,3,5,6) O uso crônico ou superdosagem pode resultar em diarreia, com distúrbios hidroeletrolíticos, acidose ou alcalose metabólica, albuminúria, hematúria e principalmente hipocalemia. A deficiência de potássio pode conduzir à disfunção cardíaca e neuromuscular,(2,5,6) lentidão, inibição do peristaltismo intestinal e má absorção,(5) além de dependência, com possível necessidade de aumento da dose,(2,5) podendo resultar no agravamento da constipação intestinal.(3,5) O uso prolongado também está associado à redução na concentração de globulinas séricas,(3,4) perda de peso e desenvolvimento de caquexia.(2,4,5) Em pacientes idosos, o uso contínuo de laxantes pode ocasionar exacerbação da fraqueza e hipotensão arterial ortostática.(2) O uso a longo prazo pode resultar em tetania, hiperaldosteronismo, excreção de aspartilglicosamina e nefrite. Além disso, dados conflitantes sugerem que possam ocorrer alterações anatômicas do cólon e danos ao sistema nervoso do tecido entérico.(3,7,8) O uso prolongado e excessivo da S. alexandrina foi associado a casos de “dedo em baqueta de tambor”, reversível após a descontinuação do uso da droga.(4) Em casos raros, pode levar a nefropatia, e edema. (2) Há relato de hepatite após o abuso crônico desse fitoterápico.(2)","INTERAÇÕES MEDICAMENTOSAS":"O aumento do peristaltismo intestinal, em virtude da utilização de S. alexandrina, pode reduzir a absorção de fármacos administrados oralmente, Senna alexandrina Mill. como por exemplo, os estrógenos assim como os anticoncepcionais orais.(2) A hipocalemia, decorrente da utilização prolongada de S. alexandrina, pode potencializar os efeitos dos glicosídeos cardiotônicos (digitálicos, Strophantus spp.) e as arritmias cardíacas ou os efeitos antiarrítmicos, quando do uso concomitante de fármacos antiarrítmicos como a quinidina.(2,6) O uso simultâneo de S. alexandrina com outros medicamentos ou drogas vegetais que induzem à hipocalemia, como diuréticos tiazidas, adrenocorticosteroides ou raiz de alcaçuz, pode exacerbar o desequilíbrio eletrolítico, resultando em disfunções cardíacas e neuromusculares.(6) Pode haver interação da S. alexandrina com a nifedipina e indometacina e outros anti-inflamatórios não hormonais. A alteração de coloração na urina causada pelas antraquinonas pode influenciar em testes de diagnósticos resultando em falso positivo para urobilinogênio e para dosagem de estrógeno pelo método de Kober.(2,3,6)","FORMAS FARMACÊUTICAS":"Cápsulas e comprimidos contendo a droga vegetal, e extratos padronizados em senosídeos.","VIAS DE ADMINISTRAÇÃO E POSOLOGIA (DOSE E INTERVALO)":"Oral. Uso adulto e infantil acima de 12 anos. Droga vegetal: 1 a 2g de folhas ou frutos, diariamente antes de dormir. 150 mg de extrato seco, de uma a três vezes ao dia, equivalente a 10-30 mg de senosídeos (calculados como senosídeo B), administrada à noite.(2)","TEMPO DE UTILIZAÇÃO":"Contraindicado por mais de duas semanas sem supervisão médica.(2)","SUPERDOSAGEM":"Os principais sintomas da superdosagem são dores abdominais,(5,6) espasmos, náusea, cólicas e diarreias severas, com consequente perda excessiva de fluidos e eletrólitos.(5) Deve-se manter tratamento de suporte, através da ingestão de grandes quantidades de líquidos. Os eletrólitos, especialmente o potássio, devem ser monitorados, particularmente em idosos e crianças. (2,5,6)","PRESCRIÇÃO":"Fitoterápico, isento de prescrição médica."}},{"scientific":"Serenoa repens (W. Bartram) Small","name":"Saw palmetto","id":22,"page":94,"fields":{"Família":"Arecaceae.(1)","Nomenclatura popular":"Saw-palmetto.(2)","Parte utilizada/órgão vegetal":"Frutos.(2)","INDICAÇÕES TERAPÊUTICAS":"Tratamento sintomático da hiperplasia prostática benigna (HPB).(2)","CONTRAINDICAÇÕES":"Contraindicado para crianças, grávidas, lactantes e pacientes com histórico de hipersensibilidade e alergia a qualquer uma das substâncias ativas da espécie vegetal. Esse fitoterápico não é indicado para casos avançados de HPB com severa retenção urinária e afecções hepáticas.(3)","PRECAUÇÕES DE USO":"Não deverá ser utilizado sem primeiro afastar a possibilidade de câncer de próstata. Os pacientes devem passar por criteriosa avaliação médica antes de utilizar esse medicamento, a fim de excluir a possibilidade de nefrite, infecções do trato urinário e outras desordens nefro urológicas.(3) Os seguintes fatores devem ser levados em consideração antes do início do tratamento com Serenoa repens: idade > 70 anos, pico de fluxo urinário < 12 mL/s, volume da próstata de 30 cm3, volume residual > 50 mL e PSA sanguíneo de 1,4 ng/mL.(3)","EFEITOS ADVERSOS":"Esse fitoterápico pode causar náuseas, dor abdominal, distúrbios gástricos, constipação intestinal e diarreia. Em casos raros, hipertensão arterial, diminuição da libido, impotência sexual, cefaleia e retenção urinária, síndrome de íris flácida intraoperatória.(3)","INTERAÇÕES MEDICAMENTOSAS":"Hormônios utilizados na Terapia de Reposição Hormonal (TRH) podem exigir ajuste de dose, devido aos efeitos antiandrogênicos e antiestrogênicos desse fitoterápico. Em estudo in vitro verificou-se a potencialização da inibição dos antagonistas do 1-alfa-adrenoreceptor, porém a relevância clinica desse não foi confirmada.(4) Não utilizar esse medicamento com anticoagulantes como warfarina, clopidogrel e ácido acetilsalicílico.(3)","FORMAS FARMACÊUTICAS":"Cápsulas gelatinosas e comprimidos contendo a droga vegetal, ou extratos padronizados (70–95% ácidos graxos livres e ésteres etílicos correspondentes).(2)","VIAS DE ADMINISTRAÇÃO E POSOLOGIA (DOSE E INTERVALO)":"Oral. Dose diária: 1–2 g da droga ou 320 mg (dose única ou 160 mg, duas vezes ao dia) do extrato lipidoesterólico padronizado para conter 70–95% ácidos graxos livres e ésteres etílicos correspondentes e formas farmacêuticas equivalentes.(2)","TEMPO DE UTILIZAÇÃO":"Não foram encontrados dados descritos na literatura consultada sobre o tempo máximo de utilização. O tempo de uso depende da indicação terapêutica e da evolução do quadro acompanhada pelo médico.","SUPERDOSAGEM":"Não foram encontrados dados descritos na literatura consultada sobre problemas decorrentes de superdosagem. Em caso de ingestão de quantidades acima das recomendadas o paciente deve ser observado.","PRESCRIÇÃO":"Fitoterápico, somente sob prescrição medica."}},{"scientific":"Stryphnodendron adstringens (Mart.) Coville","name":"Barbatimão","id":23,"page":97,"fields":{"Família":"Legu
