minosae.(1)","Nomenclatura popular":"Barbatimão.(2)","Parte utilizada/órgão vegetal":"Cascas.(2)","INDICAÇÕES TERAPÊUTICAS":"Cicatrizante.(3)","CONTRAINDICAÇÕES":"Contraindicado em situações em que há necessidade da exsudação por meio de drenos ou de forma espontânea.(3)","PRECAUÇÕES DE USO":"As formas farmacêuticas de uso externo não deverão ser aplicadas em úlceras ou ferimentos que necessitem de alta vascularização.(3)","EFEITOS ADVERSOS":"Poderá ocorrer reação alérgica em pessoas com histórico de alergias a outras espécies vegetais.(3)","INTERAÇÕES MEDICAMENTOSAS":"Devido à presença de taninos como componente desse fitoterápico, evitar o uso concomitante com sais de prata, bases proteicas e princípios ativos vasodilatadores.(3)","FORMAS FARMACÊUTICAS":"Uso externo Creme: contendo 10% de extrato glicólico de S. adstringens.(3) Pomadas: contendo 5% do extrato glicólico de S. adstringens ou pomada contendo 3% de extrato seco.(14) ** As preparações devem conter 30 mg de fenóis totais e 27 mg de taninos totais.(3)","VIAS DE ADMINISTRAÇÃO E POSOLOGIA (DOSE E INTERVALO)":"Uso externo Aplicar até três vezes ao dia na área afetada, após a higienização.(3)","TEMPO DE UTILIZAÇÃO":"O tempo de uso depende da indicação terapêutica e da evolução do quadro acompanhada pelo médico.","SUPERDOSAGEM":"Em caso de administração de quantidades acima das recomendadas, suspender o uso e manter o paciente em observação.","PRESCRIÇÃO":"Fitoterápico, isento de prescrição médica."}},{"scientific":"Trifolium pratense L.","name":"Trevo-vermelho","id":24,"page":100,"fields":{"Família":"Leguminosae.(1)","Nomenclatura popular":"Trevo-vermelho.(2,3)","Parte utilizada/órgão vegetal":"Inflorescências secas.(4)","INDICAÇÕES TERAPÊUTICAS":"Alívio dos sintomas da menopausa (principalmente fogachos), mastalgia e síndrome pré-menstrual.(5-11)","CONTRAINDICAÇÕES":"Produtos a base da inflorescência de Trifolium pratense são contraindicados em casos de hipersensibilidade ou alergia a droga vegetal ou a espécie in natura. Está também contraindicado durante a gravidez, na amamentação e para crianças menores de 12 anos, e em casos de doenças hormonais associadas, ao efeito potencial dos hormônios.(4)","PRECAUÇÕES DE USO":"Deverão ser observadas as condições que podem ser agravadas pelo aumento do nível de estrogênio, como a endometriose ou miomas uterinos.(11)","EFEITOS ADVERSOS":"A ingestão de grandes quantidades de T. pratense em alimentos por animais tem sido associada a um número de efeitos adversos em ovelhas na Austrália. A “doença do trevo” caracterizada por sintomas de infertilidade, lactação anormal, distocia e prolapso uterino, foram hipoteticamente atribuídos aos efeitos estrogênicos de isoflavonas.(12) Em nenhum dos ensaios clínicos controlados observou-se efeitos adversos com doses de até 0,160 g de isoflavonas por dia.(13,14)","INTERAÇÕES MEDICAMENTOSAS":"Alguns estudos possibilitam imaginar que as isoflavonas específicas podem aumentar a capacidade do tamoxifeno de inibir o crescimento de células de câncer de mama estrogênico-receptor positivo. (15-17) Em modelos de roedores, a genisteína tem inibido a eficácia do tamoxifeno sobre o crescimento de células de câncer de mama hormônio-receptor positivo em ratas ovariectomizadas, enquanto que em outros estudos verificaram que isoflavonas específicas podem produzir efeito aditivo e sinérgico na prevenção do desenvolvimento de tumores induzidos quimicamente e o crescimento de tumores existentes. Portanto, o uso da droga bruta ou suas preparações não é recomendado em pacientes que estão sendo tratadas com tamoxifeno e outros medicamentos anti-estrogênicos.(18-20) As isoflavonas presentes nos extratos de T. pratense são inibidoras das enzimas hepáticas CYP 1A1, CYP 1B1 e CYP 2CP o que pode levar ao aumento dos níveis séricos de alguns fármacos.(21) Podem interagir potencialmente com anticoagulantes (heparina e varfarina) e antiagregantes plaquetários (aspirina, clopidogrel e ticlopidina), por isso recomenda-se cautela na utilização de T. pratense em pacientes susceptíveis a sangramentos ou com distúrbios de coagulação.(21,22)","FORMAS FARMACÊUTICAS":"Cápsulas e comprimidos contendo extrato bruto padronizado (0,5% de isoflavonas). Extrato bruto padronizado não menos que 0,5% de isoflavonas (daidzeína, genisteína, formononetina e biochanina A).(1)","VIAS DE ADMINISTRAÇÃO E POSOLOGIA (DOSE E INTERVALO)":"Oral. Extrato bruto: 240-480 mg correspondendo a 40-80 mg/dia de isoflavonas.(4)","TEMPO DE UTILIZAÇÃO":"Extrato padronizado de T. pratense pode ser utilizado com segurança em administração diária por 12 meses.(23)","SUPERDOSAGEM":"Não foram encontrados dados descritos na literatura consultada sobre problemas decorrentes de superdosagem. Em caso de ingestão de quantidades acima das recomendadas o paciente deve ser observado","PRESCRIÇÃO":"Fitoterápico, somente sob prescrição médica. Trifolium pratense L."}},{"scientific":"Uncaria tomentosa (Willd. ex Roem. & Schult.) DC.","name":"Unha-de-gato","id":25,"page":104,"fields":{"Família":"Rubiaceae.(1)","Nomenclatura popular":"Unha-de-gato, espera-aí, junpindá.(2,3)","Parte utilizada/órgão vegetal":"Cascas.(4,5)","INDICAÇÕES TERAPÊUTICAS":"Anti-inflamatório.(6)","CONTRAINDICAÇÕES":"Contraindicado para grávidas e lactantes.(7)","PRECAUÇÕES DE USO":"Pacientes que serão submetidos a transplantes, devido ao seu efeito imunoestimulante, não devem fazer o uso desse fitoterápico.(8,9)","EFEITOS ADVERSOS":"Potencializa a ação de anticoagulantes, aumentando o risco de hemorragias.(9,10)","INTERAÇÕES MEDICAMENTOSAS":"Administrar em associação com medicamentos e drogas vegetais, como varfarina, estrógenos, teofilina e gengibre, metabolizados pela via do citocromo P-450, apenas com acompanhamento médico.(11)","FORMAS FARMACÊUTICAS":"Cápsulas e comprimidos contendo extrato seco. Decocto. Extrato fluido.(12,13)","VIAS DE ADMINISTRAÇÃO E POSOLOGIA (DOSE E INTERVALO)":"Oral. Extrato fluido: de 2,5 a 5 mL, 1 a 2 vezes ao dia.(13) Comprimido contendo 350 mg de extrato seco, duas vezes ao dia.(14) Cápsula (droga vegetal): 300–500 mg, 1 cápsula, 2 a 3 vezes ao dia.(11) Extrato seco (aquoso): 20–35 mg/kg, 1 vez por dia. (12,15) Decocto: 500 mg para 150 mL de água.","TEMPO DE UTILIZAÇÃO":"Utilizar por, no máximo, oito semanas.(14)","SUPERDOSAGEM":"Em caso de administração acima das doses recomendadas, suspender o uso e manter o paciente em observação.","PRESCRIÇÃO":"Fitoterápico, isento de prescrição médica."}},{"scientific":"Valeriana officinalis L.","name":"Valeriana","id":26,"page":107,"fields":{"Família":"Caprifoliaceae.(1)","Nomenclatura popular":"Valeriana.(2)","Parte utilizada/órgão vegetal":"Raízes.(2)","INDICAÇÕES TERAPÊUTICAS":"Usado como sedativo moderado, hipnótico e no tratamento de distúrbios do sono associados à ansiedade.(2)","CONTRAINDICAÇÕES":"Contraindicado para menores de 12 anos, grávidas, lactantes e pacientes com histórico de hipersensibilidade e alergia a qualquer um dos componentes do fitoterápico.(4,18)","PRECAUÇÕES DE USO":"Esse fitoterápico pode causar sonolência, não sendo, portanto, recomendável a sua administração antes de dirigir, operar máquinas ou realizar qualquer atividade de risco que necessite atenção.(4,5)","EFEITOS ADVERSOS":"Os efeitos adversos relatados pelos voluntários participantes dos ensaios clínicos e tratados com os diferentes extratos secos padronizados de V. officinalis foram raros, leves e similares àqueles apresentados pelos grupos tratados com o placebo.(6,7) Tais efeitos adversos incluem tontura, desconforto gastrointestinal, alergias de contato, cefaleia e midríase.(8-12) Com o uso em longo prazo, os seguintes sintomas podem ocorrer: cefaleia, cansaço, insônia, midríase e desordens cardíacas.(3) O uso de altas doses de V. officinalis por muitos anos aumentou a possibilidade de ocorrência de síndrome de abstinência com a retirada abrupta do fitoterápico.(5)","INTERAÇÕES MEDICAMENTOSAS":"Esse fitoterápico pode potencializar o efeito de outros depressores do SNC. Em estudos em animais verificou-se que V. officinalis possui efeito aditivo quando utilizada em combinação com barbitúricos, anestésicos ou benzodiazepínicos e outros fármacos depressores do SNC.(3,13) O extrato aquoso aumentou o tempo de sono com o tiopental (via oral em camundongo) e o extrato etanólico prolongou a anestesia promovida por tiopental (em camundongo) devido a sua afinidade aos receptores barbitúricos, e o extrato de V. officinalis e valepotriatos com receptores GABA e benzodiazepínicos (in vitro) e à diminuição dos efeitos causados pela retirada do diazepam por uma dose suficientemente grande de valepotriatos (em ratos), extratos de V. officinalis contendo valepotriatos, podendo auxiliar na síndrome de abstinência pela retirada do uso do diazepam.(14) Evitar o uso de V. officinalis com a ingestão de bebidas alcoólicas pela possível exacerbação dos efeitos sedativos.(15) Interações clínicas relevantes com drogas metabolizadas por CYP 2D6, CYP 3A4/5, CYP 1A2 ou CYP 2E1 não foram observadas.(18)","FORMAS FARMACÊUTICAS":"Cápsulas ou comprimidos contendo a droga vegetal (raízes secas) ou extratos (hidroetanólico 40-70% (v/v); extratos aquosos) e tintura. Armazenar em frascos hermeticamente fechados, ao abrigo da luz e em local sob controle de temperatura.(2)","VIAS DE ADMINISTRAÇÃO E POSOLOGIA (DOSE E INTERVALO)":"Oral. Pode ser utilizado para maiores de 12 anos, adultos e idosos. Se for prescrito o extrato hidroetanólico acima descrito: o equivalente a duas a três gramas. Droga vegetal: de 0,3 a 1 g da droga vegetal para usar o pó em cápsula. Como droga vegetal para preparação do decocto: 1 a 3 g. Extrato aquoso: 1 a 3 g. Tinturas (1:5, etanol 70%) 1 a 3 mL. Alcoolatura: de 2 a 5 mL.(19) Extrato seco: de 45 a 125 mg de dose diária.(19) Posologia - como sedativo leve: 1 a 3 vezes ao dia. Para distúrbios do sono: dose única antes de dormir mais uma dose no início da noite caso seja necessário. Dose máxima diária: 4 vezes ao dia.(2,18)","TEMPO DE UTILIZAÇÃO":"Para alcançar um efeito ótimo de tratamento, o uso continuado é recomendado durante 2-4 semanas, Valeriana officinalis L. não sendo indicado o tratamento agudo. Se os sintomas persistirem ou se agravar após 2 semanas de uso contínuo, o médico deve ser consultado.(18)","SUPERDOSAGEM":"Em casos de superdosagem (doses de raiz superiores a 20 g) podem ocorrer sintomas adversos leves como fadiga, câimbras abdominais, tensionamento do tórax, tontura, tremores e midríase que desapareceram no período de 24 horas após descontinuação do uso.(4) Altas doses de V. officinalis podem causar bradicardias, arritmias e redução do peristaltismo intestinal.(18)","PRESCRIÇÃO":"Fitoterápico, somente sob prescrição médica."}},{"scientific":"Zingiber officinale Roscoe","name":"Gengibre","id":27,"page":110,"fields":{"Família":"Zingiberaceae.(1)","Nomenclatura popular":"Gengibre.(2)","Parte utilizada/órgão vegetal":"Rizomas.(2)","INDICAÇÕES TERAPÊUTICAS":"Antiemético, antidispéptico, e nos casos de cinetose.(3)","CONTRAINDICAÇÕES":"Contraindicado para pessoas com cálculos biliares, irritação gástrica e hipertensão arterial. Não é indicado para crianças.(2)","PRECAUÇÕES DE USO":"Os pacientes que tomam medicamentos anticoagulantes ou que apresentam distúrbios da coagulação sanguínea devem consultar seu médico antes de se auto-medicar com gengibre. Pacientes com cálculos biliares devem consultar seu médico antes de usar preparações de gengibre.(4)","EFEITOS ADVERSOS":"Dermatite de contato tem sido relatada em pacientes sensíveis.(5)","INTERAÇÕES MEDICAMENTOSAS":"O gengibre pode afetar o tempo de sangramento e parâmetros imunológicos, devido a sua capacidade de inibir a tromboxano-sintetase e por atuar como agonista da prostaciclina.(6,7) No entanto, um estudo randomizado, duplo-cego sobre os efeitos de gengibre seco (2 g/dia, oralmente durante 14 dias) na função plaquetária não mostrou diferenças nos tempos de sangramento em pacientes que receberam gengibre ou placebo.(8,9)","FORMAS FARMACÊUTICAS":"Cápsulas ou comprimidos contendo extrato seco, droga vegetal (rizomas), extrato fluido, e tintura. (2,10) Gengibre em pó deve ser armazenado em recipientes hermeticamente fechados (não de plástico), ao abrigo da umidade e da luz, em local seco e fresco.(11,12)","VIAS DE ADMINISTRAÇÃO E POSOLOGIA (DOSE E INTERVALO)":"Oral. Infuso: acima de 12 anos: de 0,5 a 1 g em 150 mL de água, 5 minutos após o preparo, tomar de duas a quatro vezes ao dia.(2) Tintura: tomar 2,5 mL da tintura diluída em 75 mL de água, uma a três vezes ao dia ou 1,5 a 3,0 mL diariamente.(2,51) Em casos de cinetose em adultos e crianças com mais de 6 anos: 0,5 g, 2 a 4 vezes ao dia.(13,51) Dispepsia: 2 a 4 g da droga vegetal ou extrato seco.(3,14)","TEMPO DE UTILIZAÇÃO":"Pacientes que usaram gengibre por um período de 3 meses a 2,5 anos não apresentaram efeitos adversos.(15)","SUPERDOSAGEM":"Altas doses (12-14 g) de gengibre podem aumentar os efeitos hipotrombinêmicos da terapia anticoagulante.","PRESCRIÇÃO":"Fitoterápico, isento de prescrição médica."}}];let page='home',selected=null,tab='Visão geral',query='';let fav;try{fav=new Set(JSON.parse(localStorage.getItem('phytotheca-favorites')||'[]'))}catch{fav=new Set()}const app=document.getElementById('app');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function navigate(p){page=p;query='';render();scrollTo(0,0)}function openPlant(id){selected=plants[id];tab='Visão geral';page='detail';render();scrollTo(0,0)}function toggleFav(id){fav.has(id)?fav.delete(id):fav.add(id);try{localStorage.setItem('phytotheca-favorites',JSON.stringify([...fav]))}catch{}render()}function nav(){return `<nav class="nav">${[['home','⌂','Início'],['plants','♧','Plantas'],['favorites','♡','Favoritos'],['more','☷','Mais']].map(([p,i,t])=>`<button class="${page===p?'active':''}" onclick="navigate('${p}')"><b>${i}</b>${t}</button>`).join('')}</nav>`}function home(){return `<div class="hero"><div class="eyebrow">Atlas clínico · Fitoterapia</div><div class="hero-center"><div class="hero-mark" aria-hidden="true">❧</div><h1>PHYTOTHECA</h1><div class="hero-sub">BOTÂNICA, CIÊNCIA E PRÁTICA CLÍNICA</div></div><div class="hero-bottom"><input class="search" placeholder="Buscar planta, nome científico..." onfocus="navigate('plants')"><div class="hero-actions"><button onclick="navigate('plants')">Explorar atlas botânico ↗</button><button onclick="navigate('more')">Glossário e ferramentas ↗</button></div><div class="hero-note">28 monografias · Memento Fitoterápico</div><div class="small">Transcrição do Memento (2016), conferida automaticamente com a estrutura do documento; requer revisão humana antes de uso clínico.</div></div></div>`}function rows(arr){return arr.length?arr.map(p=>`<button class="plant" onclick="openPlant(${p.id})"><span class="thumb" aria-hidden="true">❧</span><span class="plant-name"><strong><i>${esc(p.scientific)}</i></strong><em>${esc(p.name)}</em></span><span class="arrow">›</span></button>`).join(''):'<p class="small">Nenhuma espécie encontrada.</p>'}function filtered(){return plants.filter(p=>(page!=='favorites'||fav.has(p.id))&&(`${p.name} ${p.scientific}`).toLocaleLowerCase('pt-BR').includes(query.toLocaleLowerCase('pt-BR'))).sort((a,b)=>a.scientific.localeCompare(b.scientific,'pt-BR'))}function listing(){return `<div class="top"><div class="eyebrow">Biblioteca científica</div><h2>${page==='favorites'?'Favoritos':'Plantas medicinais'}</h2><p class="small">28 monografias em ordem alfabética pelo nome científico, conforme o Memento Fitoterápico da Anvisa (2016).</p></div><div class="content"><input class="search" value="${esc(query)}" placeholder="Buscar por nome popular ou científico" oninput="query=this.value;updateList()"><p class="count">28 monografias · A–Z pelo nome científico</p><div id="list">${rows(filtered())}</div></div>`}function updateList(){document.getElementById('list').innerHTML=rows(filtered())}function section(title,txt,cls=''){return `<div class="section ${cls}"><h3>${title}</h3><p>${txt}</p></div>`}function detail(){const p=selected;const f=p.fields;const field=(key)=>f[key]||'Não foram identificadas informações específicas neste campo na extração do documento. Consulte a página indicada do Memento.';const tabs=p.id===0?['Visão geral','Indicações','Uso e dose','Contraindicações','Interações','Segurança','Evidências','Referências']:['Visão geral','Indicações','Uso e dose','Contraindicações','Interações','Segurança','Evidências','Referências'];let body=tab==='Visão geral'?`<div class="section"><div class="label">Identificação botânica</div><h3>${esc(p.name)}</h3><p><i>${esc(p.scientific)}</i></p></div>${section('Família',esc(field('Família')))}${section('Nomenclatura popular no Memento',esc(field('Nomenclatura popular')))}${section('Parte utilizada',esc(field('Parte utilizada/órgão vegetal')))}${f['Sinonímia']?section('Sinonímia',esc(f['Sinonímia'])):''}`:tab==='Indicações'?section('Indicações terapêuticas',esc(field('INDICAÇÕES TERAPÊUTICAS'))):tab==='Uso e dose'?section('Preparações e formas farmacêuticas',esc(field('FORMAS FARMACÊUTICAS')))+section('Posologia e via de administração',esc(field('VIAS DE ADMINISTRAÇÃO E POSOLOGIA (DOSE E INTERVALO)')))+section('Tempo de utilização',esc(field('TEMPO DE UTILIZAÇÃO')))+section('Prescrição',esc(field('PRESCRIÇÃO'))):(tab==='Segurança'||tab==='Contraindicações')?section('Contraindicações',esc(field('CONTRAINDICAÇÕES')),'safety')+section('Precauções e advertências',esc(field('PRECAUÇÕES DE USO')),'safety')+section('Efeitos adversos',esc(field('EFEITOS ADVERSOS')),'safety')+section('Superdosagem',esc(field('SUPERDOSAGEM')),'safety'):section('Interações medicamentosas',esc(field('INTERAÇÕES MEDICAMENTOSAS')),'safety');if(p.id===0){const intro='<div class="notice">Ficha 01/28 · Conferida com o Memento Fitoterápico da Farmacopeia Brasileira, 1ª edição (2016), páginas 18–20. Informações para estudo; não constitui prescrição.</div>';const first={
'Visão geral':section('Identificação botânica','Nome científico: Actaea racemosa L. | Família: Ranunculaceae | Sinônimo: Cimicifuga racemosa (L.) Nutt. | Nome popular: Cimicífuga | Parte utilizada: raiz ou rizoma.')+section('Principais classes químicas','Triterpenos (cimifugosídeo, 26-deoxiacteína, acteína e cimigenol), alcaloides, taninos e ácidos fenólicos.'),
'Indicações':section('Indicações terapêuticas','Alívio dos sintomas do climatério: rubor, fogachos, transpiração excessiva, palpitações, alterações do humor, ansiedade e depressão.'),
'Uso e dose':section('Formas farmacêuticas e conservação','Cápsulas e comprimidos contendo droga vegetal, extrato seco etanólico ou isopropílico. Armazenar ao abrigo da luz em local fechado.')+section('Via oral — doses por preparação','Extrato seco etanólico: 6 mg por dia. Rizomas secos: 40–200 mg por dia, divididos em doses. Tintura 1:10 em etanol a 60%: 0,4–2 mL por dia. Raiz em pó ou chá: 1–2 g, três vezes ao dia. As doses são específicas para cada preparação e não são intercambiáveis.')+section('Tempo de utilização','Não utilizar por mais de seis meses. O tempo depende da indicação e do acompanhamento profissional.')+section('Prescrição','Somente sob prescrição médica.'),
'Contraindicações':section('Contraindicações','Hipersensibilidade aos componentes do fitoterápico; insuficiência hepática; gravidez.','safety')+section('Precauções','Suspender o uso se surgirem sinais sugestivos de insuficiência hepática: astenia, inapetência, icterícia, dor epigástrica intensa com náuseas e vômitos ou urina escura. Cautela em pessoas alérgicas à aspirina ou outros salicilatos. Quando associada à terapia de reposição hormonal, avaliação médica a cada seis meses.','safety')+section('Efeitos adversos','Desconforto gastrointestinal, erupção cutânea, cefaleia e tontura.','safety')+section('Superdosagem','Vertigem, cefaleia, náusea, vômito, hipotensão arterial, distúrbios visuais e circulatórios.','safety'),
'Segurança':section('Contraindicações','Hipersensibilidade aos componentes do fitoterápico; insuficiência hepática; gravidez.','safety')+section('Precauções de uso','Suspender o uso se surgirem astenia, inapetência, icterícia, dor epigástrica intensa com náuseas e vômitos ou urina escura, que podem sugerir insuficiência hepática. Cautela em pessoas alérgicas à aspirina ou outros salicilatos. Em associação à terapia de reposição hormonal, manter avaliação médica a cada seis meses.','safety')+section('Efeitos adversos','Desconforto gastrointestinal, erupção cutânea, cefaleia e tontura.','safety')+section('Superdosagem','Pode causar vertigem, cefaleia, náusea, vômito, hipotensão arterial, distúrbios visuais e circulatórios.','safety'),
'Interações':section('Interações medicamentosas','Pode antagonizar o efeito imunossupressor da ciclosporina e azatioprina, com possível risco de rejeição em pacientes transplantadas. Possível interação com atorvastatina. Cautela com hipotensores como metoprolol, propranolol, diltiazem e verapamil. Possíveis interações com analgésicos e anestésicos e efeitos aditivos com agentes gastrointestinais.','safety'),
'Evidências':section('Ensaios não clínicos','O Memento descreve investigações em células e animais, incluindo efeitos sobre proliferação celular, parâmetros hormonais e inflamação. Resultados experimentais não comprovam eficácia no tratamento de câncer em pessoas.')+section('Ensaios clínicos de eficácia','Estudo duplo-cego de 12 semanas descrito na monografia relatou melhora de sintomas do climatério com extrato de Actaea racemosa, superior ao placebo e semelhante aos estrogênios conjugados nas condições investigadas.')+section('Segurança hepática','Uma metanálise de cinco ensaios clínicos randomizados (N=1117) e um estudo prospectivo com 87 mulheres não relataram alterações hepáticas significativas nas condições estudadas. Esses achados não anulam as contraindicações e advertências hepáticas da monografia.'),
'Referências':section('Fonte primária','ANVISA. Memento Fitoterápico da Farmacopeia Brasileira. 1ª edição, 2016. Monografia Actaea racemosa L., páginas 18–20.')+section('Bibliografia','A página 20 da monografia contém 19 referências numeradas, incluindo monografias da OMS, EMA e estudos clínicos. Para consulta das referências completas, utilizar o Memento original. Observação editorial: a referência (14), citada para duração de uso, parece tratar de outra espécie e requer conferência bibliográfica.')};body=intro+(first[tab]||'');}if(p.id!==0&&tab==='Evidências'){body=section('Evidências clínicas','Esta seção ainda não foi revisada individualmente. Consulte a monografia original do Memento para os estudos e a bibliografia correspondentes.')}if(p.id!==0&&tab==='Referências'){body=section('Fonte primária',`ANVISA. Memento Fitoterápico da Farmacopeia Brasileira, 1ª edição (2016). Monografia de ${esc(p.scientific)}, página inicial ${p.page}. Consulte o documento oficial para as referências bibliográficas completas.`)}return `<div class="detail-hero">❧</div><div class="detail"><button class="back" onclick="navigate('plants')">← Voltar às plantas</button><div class="detail-title"><h2>${esc(p.name)}</h2><button class="favorite" aria-label="Favoritar" onclick="toggleFav(${p.id})">${fav.has(p.id)?'♥':'♡'}</button></div><div class="latin">${esc(p.scientific)}</div><div class="tabs">${tabs.map((t,i)=>`<button class="${tab===t?'active':''}" onclick="tab='${t}';render()"><span class="tab-icon" aria-hidden="true">${['◈','✿','◷','⊘','⇄','◇','▤','☷'][i]}</span>${t}</button>`).join('')}</div>${body}<div class="section"><div class="label">Fonte oficial</div><p>Memento Fitoterápico da Farmacopeia Brasileira, Anvisa, 1ª edição (2016), monografia iniciada na página ${p.page} (numeração impressa).</p></div><div class="notice">Atlas acadêmico. Conteúdo transcrito do Memento de 2016 e conferido automaticamente; requer revisão humana; a dose depende da preparação e da orientação de profissional habilitado. Não substitui consulta à fonte original ou avaliação clínica.</div></div>`}
function more(){const glossary=[['Infusão','Preparação em que se verte água aquecida sobre o material vegetal e se mantém contato pelo tempo indicado na referência.'],['Decocção','Preparação em que o material vegetal é aquecido com água durante um período determinado.'],['Maceração','Extração por contato do material vegetal com um líquido apropriado, sem fervura.'],['Tintura','Preparação extrativa líquida, frequentemente com solvente hidroalcoólico, sob condições definidas.']];return `<div class="top"><div class="eyebrow">Referência e apoio</div><h2>Glossário</h2><p class="small">Conceitos introdutórios de fitoterapia.</p></div><div class="content">${glossary.map(([a,b])=>section(a,b)).join('')}<div class="section"><h3>Fontes e limitações</h3><p>As 28 monografias foram extraídas do Memento de 2016. O conteúdo deve ser revisado antes de uso profissional. As fotografias botânicas ainda não foram incluídas.</p><p><a href="https://www.gov.br/anvisa/pt-br/assuntos/farmacopeia" target="_blank" rel="noopener noreferrer">Portal oficial da Farmacopeia Brasileira (Anvisa) ↗</a></p></div><button class="action" onclick="navigate('calculator')">Abrir calculadora de proporção →</button></div>`}function calculator(){return `<div class="top"><div class="eyebrow">Ferramentas</div><h2>Calculadora</h2><p class="small">Conversão matemática, não uma recomendação de dose.</p></div><div class="content">${[['grams','Massa de referência (g)'],['reference','Volume de referência (mL)'],['volume','Volume desejado (mL)']].map(([id,t])=>`<div class="field"><label for="${id}">${t}</label><input id="${id}" type="number" min="0" step="any" placeholder="Digite um número positivo"></div>`).join('')}<button class="action" onclick="calc()">Calcular proporção</button><div class="result" id="answer"><span class="small">Preencha os três campos.</span></div><p class="small">Fórmula: massa proporcional = massa de referência × volume desejado ÷ volume de referência. Confira sempre a preparação e a dose em fonte oficial.</p></div>`}function calc(){const g=Number(document.getElementById('grams').value),r=Number(document.getElementById('reference').value),v=Number(document.getElementById('volume').value);document.getElementById('answer').innerHTML=g>0&&r>0&&v>0&&Number.isFinite(g*v/r)?`<span class="small">Resultado matemático</span><br><strong>${(g*v/r).toLocaleString('pt-BR',{maximumFractionDigits:3})} g</strong><p class="small">Não equivale a uma dose recomendada.</p>`:'<span class="small">Informe três valores positivos e válidos.</span>'}function render(){app.innerHTML=(page==='home'?home():page==='plants'||page==='favorites'?listing():page==='detail'?detail():page==='calculator'?calculator():more())+nav()}render();
</script></body></html>
