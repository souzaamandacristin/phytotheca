<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#142f26"><title>PHYTOTHECA · Atlas de fitoterapia</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"><style>
:root{--ink:#294c48;--paper:#faf7f0;--muted:#65716c;--line:#e0dbcf;--gold:#a27b48;--rust:#a85d49}*{box-sizing:border-box}body{margin:0;background:#e7e9e4;color:var(--ink);font-family:'DM Sans',Arial,sans-serif}button,input{font:inherit}button{cursor:pointer}#app{max-width:680px;margin:auto;background:var(--paper);min-height:100dvh;padding-bottom:86px;box-shadow:0 12px 65px #243c2c22}.hero{min-height:calc(100dvh - 75px);background:linear-gradient(180deg,rgba(8,31,25,.58),rgba(10,36,29,.22) 38%,rgba(7,26,23,.93)),url('https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?w=1200&auto=format&fit=crop') center/cover;color:#f7f1e5;padding:37px 29px 30px;display:flex;flex-direction:column;justify-content:space-between}.eyebrow{letter-spacing:2.2px;text-transform:uppercase;font-size:11px;color:var(--rust);font-weight:700}.hero .eyebrow{color:#d5a48f}.hero-center{text-align:center;margin-top:70px}.hero h1{font-family:'Cormorant Garamond',Georgia,serif;font-size:clamp(53px,12vw,86px);font-weight:500;letter-spacing:-2px;margin:12px 0}.hero-sub{font-size:11px;letter-spacing:3px}.hero-bottom{display:grid;gap:17px}.hero-note{font-family:'Cormorant Garamond',serif;font-size:24px;color:#ebd5b1}.search{width:100%;border:1px solid var(--line);border-radius:9px;background:#fffefa;padding:17px 18px;color:var(--ink);outline-color:var(--gold)}.hero .search{background:#f9f6ed}.hero-actions{display:grid;grid-template-columns:1fr 1fr;gap:11px}.hero-actions button{border:0;border-radius:8px;background:#f6f2e7e6;color:#294c48;padding:20px 12px;text-align:left;font-weight:700;font-size:12px}.top{padding:38px 30px 17px}.top h2,.detail h2{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;font-size:clamp(38px,8vw,54px);line-height:1;margin:13px 0}.subtitle,.small{font-size:12px;color:var(--muted);line-height:1.6}.content{padding:0 30px 35px}.plant{display:flex;align-items:center;gap:17px;width:100%;padding:18px 0;background:transparent;border:0;border-bottom:1px solid var(--line);text-align:left;color:var(--ink)}.thumb{width:76px;height:76px;background:#dfe7dc;display:grid;place-items:center;flex-shrink:0;color:#4a7466;font-size:29px}.plant strong{font-family:'Cormorant Garamond',Georgia,serif;font-size:27px;font-weight:500}.plant em{display:block;color:#8a7060;font:italic 14px Georgia,serif;line-height:1.5}.arrow{margin-left:auto;color:var(--rust);font-size:22px}.detail-hero{height:235px;background:linear-gradient(145deg,#0d2b1c,#315f42);display:grid;place-items:center;color:#a9d0b9;font-size:90px}.detail{padding:25px 30px 40px}.back{border:0;background:transparent;color:#527d70;padding:5px 0}.latin{font:italic 17px Georgia,serif;color:#957e70;line-height:1.5}.tabs{display:flex;overflow:auto;gap:7px;padding:22px 0}.tabs button{white-space:nowrap;border:0;border-radius:25px;background:#e6e4dd;padding:11px 14px;font-size:12px;color:#53665e}.tabs button.active{background:#315d57;color:white}.section{padding:24px 0;border-bottom:1px solid var(--line)}.section h3{font:500 30px 'Cormorant Garamond',Georgia,serif;margin:4px 0 10px}.section p{color:#49564f;font-size:15px;line-height:1.8}.label{font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--rust)}.notice{margin-top:26px;border-left:2px solid var(--rust);padding:12px 15px;font-size:13px;color:#6e665f;line-height:1.7}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,680px);height:76px;background:#fffcf6;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);z-index:5}.nav button{border:0;background:transparent;font-size:11px;color:#747d76}.nav b{display:block;font-size:23px;font-weight:400;margin-bottom:3px}.nav button.active{color:#315d57;font-weight:700}.action{background:#315d57;color:white;border:0;padding:13px 18px;border-radius:7px}.field{display:grid;gap:6px;margin:15px 0}.field label{font-size:13px;color:#65716c}.field input{border:1px solid var(--line);padding:13px;background:white;border-radius:7px}.result{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:20px;margin:20px 0}.result strong{font:500 36px 'Cormorant Garamond',Georgia,serif}@media(max-width:390px){.hero{padding:26px 20px}.top,.content,.detail{padding-left:20px;padding-right:20px}.hero h1{font-size:52px}}
</style></head><body><div id="app"></div><script>
const plants=[{"id": 0, "scientific": "Actaea racemosa L.", "name": "Cimicífuga", "page": 18}, {"id": 1, "scientific": "Aesculus hippocastanum L.", "name": "Castanha-da-índia", "page": 21}, {"id": 2, "scientific": "Allium sativum L.", "name": "Alho", "page": 24}, {"id": 3, "scientific": "Aloe vera (L.) Burm.f.", "name": "Babosa", "page": 28}, {"id": 4, "scientific": "Calendula officinalis L.", "name": "Calêndula", "page": 30}, {"id": 5, "scientific": "Cynara scolymus L.", "name": "Alcachofra", "page": 35}, {"id": 6, "scientific": "Echinacea purpurea (L.) Moench", "name": "Equinácea", "page": 38}, {"id": 7, "scientific": "Equisetum arvense L.", "name": "Cavalinha", "page": 40}, {"id": 8, "scientific": "Ginkgo biloba L.", "name": "Ginkgo", "page": 43}, {"id": 9, "scientific": "Glycine max (L.) Merr.", "name": "Soja", "page": 47}, {"id": 10, "scientific": "Harpagophytum procumbens DC. e Harpagophytum zeyheri Ihlenf. & H. Hartmann", "name": "Garra-do-diabo", "page": 51}, {"id": 11, "scientific": "Hypericum perforatum L.", "name": "Hipérico", "page": 54}, {"id": 12, "scientific": "Lippia sidoides Cham.", "name": "Alecrim-pimenta", "page": 58}, {"id": 13, "scientific": "Matricaria chamomilla L.", "name": "Camomila", "page": 63}, {"id": 14, "scientific": "Maytenus ilicifolia Mart. ex Reissek e Maytenus aquifolia Mart.", "name": "Espinheira-santa", "page": 66}, {"id": 15, "scientific": "Passiflora incarnata L.", "name": "Passiflora", "page": 71}, {"id": 16, "scientific": "Paullinia cupana Kunth", "name": "Guaraná", "page": 75}, {"id": 17, "scientific": "Peumus boldus Molina", "name": "Boldo", "page": 78}, {"id": 18, "scientific": "Piper methysticum G. Forst.", "name": "Kava-kava", "page": 81}, {"id": 19, "scientific": "Psidium guajava L.", "name": "Goiabeira", "page": 85}, {"id": 20, "scientific": "Rhamnus purshiana DC.", "name": "Cáscara-sagrada", "page": 88}, {"id": 21, "scientific": "Senna alexandrina Mill.", "name": "Sene", "page": 91}, {"id": 22, "scientific": "Serenoa repens (W. Bartram) Small", "name": "Saw-palmetto", "page": 94}, {"id": 23, "scientific": "Stryphnodendron adstringens (Mart.) Coville", "name": "Barbatimão", "page": 97}, {"id": 24, "scientific": "Trifolium pratense L.", "name": "Trevo-vermelho", "page": 100}, {"id": 25, "scientific": "Uncaria tomentosa (Willd. DC.)", "name": "Unha-de-gato", "page": 104}, {"id": 26, "scientific": "Valeriana officinalis L.", "name": "Valeriana", "page": 107}, {"id": 27, "scientific": "Zingiber officinale Roscoe", "name": "Gengibre", "page": 110}];
let page='home',selected=null,tab='Visão geral',query='';let fav=new Set(JSON.parse(localStorage.getItem('phytotheca-favorites')||'[]'));const app=document.getElementById('app');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function navigate(p){page=p;query='';render();window.scrollTo(0,0)}function openPlant(id){selected=plants.find(p=>p.id===id);tab='Visão geral';page='detail';render();window.scrollTo(0,0)}function toggleFav(id){fav.has(id)?fav.delete(id):fav.add(id);localStorage.setItem('phytotheca-favorites',JSON.stringify([...fav]));render()}
function nav(){return `<nav class="nav">${[['home','⌂','Início'],['plants','♧','Plantas'],['favorites','♡','Favoritos'],['more','☷','Mais']].map(([p,i,t])=>`<button class="${page===p?'active':''}" onclick="navigate('${p}')"><b>${i}</b>${t}</button>`).join('')}</nav>`}
function home(){return `<div class="hero"><div><div class="eyebrow">Atlas clínico · Fitoterapia</div><div class="hero-center"><div style="font-size:28px;color:#d5c59a">❧</div><h1>PHYTOTHECA</h1><div class="hero-sub">BOTÂNICA, CIÊNCIA E PRÁTICA CLÍNICA</div></div></div><div class="hero-bottom"><input class="search" placeholder="Buscar planta, nome científico..." onfocus="navigate('plants')"><div class="hero-actions"><button onclick="navigate('plants')">Explorar atlas botânico ↗</button><button onclick="navigate('more')">Glossário e ferramentas ↗</button></div><div class="hero-note">28 monografias · Memento Fitoterápico</div><div class="small" style="color:#ddd4c2">Catálogo corrigido conforme o sumário oficial. Fichas clínicas em revisão.</div></div></div>`}
function rows(arr){return arr.length?arr.map(p=>`<button class="plant" onclick="openPlant(${p.id})"><span class="thumb">❧</span><span><strong>${esc(p.name)}</strong><em>${esc(p.scientific)}</em></span><span class="arrow">›</span></button>`).join(''):'<p class="small">Nenhuma planta encontrada.</p>'}
function listing(){const arr=plants.filter(p=>(page!=='favorites'||fav.has(p.id))&&(`${p.name} ${p.scientific}`).toLowerCase().includes(query.toLowerCase()));return `<div class="top"><div class="eyebrow">Biblioteca científica</div><h2>${page==='favorites'?'Favoritos':'Plantas medicinais'}</h2><div class="subtitle">28 monografias do Memento Fitoterápico da Farmacopeia Brasileira · 1ª edição, 2016</div></div><div class="content"><input class="search" value="${esc(query)}" placeholder="Buscar por nome popular ou científico" oninput="query=this.value;updateList()"><p class="small">Todas as espécies · ${arr.length} resultado(s)</p><div id="list">${rows(arr)}</div></div>`}
function updateList(){document.getElementById('list').innerHTML=rows(plants.filter(p=>(page!=='favorites'||fav.has(p.id))&&(`${p.name} ${p.scientific}`).toLowerCase().includes(query.toLowerCase())))}
function detail(){const p=selected;let body=tab==='Visão geral'?`<div class="section"><div class="label">Identificação botânica</div><h3>${esc(p.name)}</h3><p><i>${esc(p.scientific)}</i></p><p>Espécie incluída no sumário da 1ª edição do Memento Fitoterápico.</p></div><div class="section"><h3>Parte utilizada</h3><p>Em conferência com a monografia oficial.</p></div>`:tab==='Indicações'?`<div class="section"><h3>Indicações terapêuticas</h3><p>Em conferência com a monografia oficial. Não utilizar como recomendação clínica.</p></div>`:tab==='Uso e dose'?`<div class="section"><h3>Formas farmacêuticas e preparo</h3><p>Em conferência com a monografia oficial.</p></div><div class="section"><h3>Posologia, via e tempo de utilização</h3><p>Em conferência com a monografia oficial.</p></div>`:tab==='Segurança'?`<div class="section"><h3>Contraindicações, precauções e efeitos adversos</h3><p>Em conferência com a monografia oficial. Não presumir segurança ou ausência de contraindicações.</p></div>`:`<div class="section"><h3>Interações medicamentosas</h3><p>Em conferência com a monografia oficial. Não presumir ausência de interações.</p></div>`;return `<div class="detail-hero">❧</div><div class="detail"><button class="back" onclick="navigate('plants')">← Voltar às plantas</button><div style="display:flex;align-items:center;justify-content:space-between"><h2>${esc(p.name)}</h2><button class="back" onclick="toggleFav(${p.id})" aria-label="Favorito" style="font-size:29px">${fav.has(p.id)?'♥':'♡'}</button></div><div class="latin">${esc(p.scientific)}</div><div class="tabs">${['Visão geral','Indicações','Uso e dose','Segurança','Interações'].map(t=>`<button class="${tab===t?'active':''}" onclick="tab='${t}';render()">${t}</button>`).join('')}</div>${body}<div class="section"><div class="label">Fonte oficial</div><p>Memento Fitoterápico da Farmacopeia Brasileira, Anvisa, 1ª edição (2016), página ${p.page} (numeração impressa).</p></div><div class="notice">Protótipo acadêmico. A presença no catálogo foi verificada pelo sumário, mas os dados clínicos ainda precisam ser transcritos e revisados antes de uso profissional.</div></div>`}
function more(){return `<div class="top"><div class="eyebrow">Referência e apoio</div><h2>Glossário</h2><div class="subtitle">Técnicas e conceitos da fitoterapia</div></div><div class="content">${[['Infusão','Preparação por contato de material vegetal com água quente, conforme as condições especificadas.'],['Decocção','Preparação por aquecimento do material vegetal em água, conforme as condições especificadas.'],['Maceração','Extração por contato do material vegetal com solvente apropriado.'],['Tintura','Preparação extrativa líquida obtida com solvente apropriado, geralmente hidroalcoólico.']].map(([a,b])=>`<div class="section"><h3>${a}</h3><p>${b}</p></div>`).join('')}<div class="section"><h3>Fonte documental</h3><p>Memento Fitoterápico da Farmacopeia Brasileira, 1ª edição (2016), Anvisa. As 28 espécies e as páginas de início foram conferidas no sumário da obra.</p><p>Fotografias botânicas e informações clínicas detalhadas ainda não foram adicionadas.</p></div><button class="action" onclick="navigate('calculator')">Abrir calculadora →</button></div>`}
function calculator(){return `<div class="top"><div class="eyebrow">Ferramentas</div><h2>Calculadora</h2><div class="subtitle">Conversão matemática de proporções</div></div><div class="content"><div class="section"><h3>Quantidade para preparo</h3><p>Insira apenas uma proporção previamente conferida na monografia oficial. Esta ferramenta não recomenda doses.</p></div><div class="field"><label>Massa de referência (g)</label><input id="grams" type="number" min="0" step="any"></div><div class="field"><label>Volume de referência (mL)</label><input id="reference" type="number" min="0" step="any"></div><div class="field"><label>Volume desejado (mL)</label><input id="volume" type="number" min="0" step="any"></div><button class="action" onclick="calc()">Calcular proporção</button><div class="result" id="answer"><span class="small">Preencha os três campos.</span></div><p class="small">Cálculo proporcional, não prescrição. Verifique limites e modo de preparo na fonte.</p></div>`}
function calc(){let g=+document.getElementById('grams').value,r=+document.getElementById('reference').value,v=+document.getElementById('volume').value;document.getElementById('answer').innerHTML=g>0&&r>0&&v>0?`<span class="small">Massa proporcional</span><br><strong>${(g*v/r).toLocaleString('pt-BR',{maximumFractionDigits:3})} g</strong>`:'<span class="small">Informe três números positivos.</span>'}
function render(){app.innerHTML=(page==='home'?home():page==='plants'||page==='favorites'?listing():page==='detail'?detail():page==='calculator'?calculator():more())+nav()}render();
</script></body></html>
