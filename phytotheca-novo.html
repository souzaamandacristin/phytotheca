<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#142f26"><title>PHYTOTHECA · Atlas de fitoterapia</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet"><style>:root{--ink:#172e28;--muted:#6b6a5e;--paper:#f6f3ea;--line:#ded9c9;--gold:#a17c42;--rust:#9b503b}*{box-sizing:border-box}body{margin:0;background:#e9e7df;color:var(--ink);font-family:'DM Sans',Arial,sans-serif}button,input,select{font:inherit}button{cursor:pointer}#app{max-width:560px;margin:auto;background:var(--paper);min-height:100dvh;padding-bottom:83px}.hero{min-height:calc(100dvh - 75px);background:linear-gradient(180deg,rgba(4,24,16,.35),rgba(5,23,15,.2) 38%,rgba(4,19,13,.95)),url('https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?w=1200&auto=format&fit=crop') center/cover;position:relative;color:#f7f1e5;padding:34px 25px 26px;display:flex;flex-direction:column;justify-content:space-between}.hero h1{font-family:'Libre Baskerville',Georgia,serif;font-size:clamp(35px,9vw,51px);font-weight:400;letter-spacing:-2px;margin:8px 0}.eyebrow{letter-spacing:3px;text-transform:uppercase;font-size:10px}.hero-sub{font-size:11px;letter-spacing:2px;line-height:1.8}.hero-center{text-align:center;margin-top:55px}.hero-bottom{display:grid;gap:17px}.search{width:100%;border:1px solid var(--line);background:#fffdf8;border-radius:28px;padding:15px 18px;outline-color:var(--gold);color:var(--ink)}.hero .search{border:0}.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.quick button{background:rgba(255,255,255,.12);border:1px solid rgba(233,216,169,.65);border-radius:7px;color:#fff9eb;padding:12px 2px;font-size:11px}.quick b{display:block;font-size:23px;font-weight:400;margin-bottom:7px;color:#e5c988}.hero-note{font-family:Georgia,serif;color:#e8d6a7;font-size:17px}.top{padding:29px 23px 14px}.top h2,.detail h2{font-family:'Libre Baskerville',Georgia,serif;font-weight:400;letter-spacing:-1px;font-size:30px;margin:7px 0}.subtitle{color:var(--muted);font-size:12px}.content{padding:0 23px 28px}.rule{border:0;border-top:1px solid var(--line);margin:18px 0}.plant{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left;color:inherit}.thumb{width:68px;height:63px;flex-shrink:0;border-radius:4px;background:linear-gradient(130deg,#dce2cf,#879b75);display:grid;place-items:center;font-size:29px;color:#345340}.plant strong{font-family:Georgia,serif;font-size:18px;font-weight:400}.plant em{display:block;font-family:Georgia,serif;color:var(--muted);font-size:12px;margin-top:4px}.plant .arrow{margin-left:auto;color:var(--gold)}.tags{display:flex;gap:7px;overflow:auto;padding:13px 0}.tag{white-space:nowrap;border:1px solid var(--line);background:transparent;padding:8px 11px;border-radius:25px;font-size:11px;color:var(--ink)}.tag.active{background:var(--ink);color:white}.detail-hero{height:260px;background:linear-gradient(150deg,#2d4c3a,#91a783);display:flex;align-items:center;justify-content:center;font-size:100px;color:#e5eadc}.detail{padding:19px 23px}.detail h2{margin-bottom:4px}.latin{font-family:Georgia,serif;font-style:italic;color:#655d50}.tabs{display:flex;gap:5px;overflow:auto;padding:15px 0}.tabs button{white-space:nowrap;border:0;background:#eae5d8;color:#38473b;padding:10px;border-radius:5px;font-size:11px}.tabs button.active{background:var(--ink);color:white}.section{padding:17px 0;border-bottom:1px solid var(--line)}.section h3{font-family:Georgia,serif;font-size:20px;font-weight:400;margin:0 0 11px}.section p{font-size:14px;line-height:1.7;margin:5px 0;color:#383e36}.section .label{color:var(--gold);font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase}.section.safety h3{color:var(--rust)}.notice{border-left:2px solid var(--gold);padding:10px 13px;background:#efebe0;font-size:13px;line-height:1.6}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,560px);height:74px;background:#faf8f1;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);z-index:9}.nav button{border:0;background:none;color:#696e64;font-size:10px}.nav button b{display:block;font-size:21px;margin-bottom:5px;font-weight:400}.nav button.active{color:#164332;font-weight:700}.action{background:var(--ink);border:0;color:#fff;border-radius:5px;padding:12px 16px}.field{display:grid;gap:6px;margin:13px 0}.field label{font-size:12px;color:var(--muted)}.field input,.field select{width:100%;border:1px solid var(--line);background:#fffdf8;padding:12px;border-radius:5px}.result{padding:18px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-top:18px;text-align:center}.result strong{font-family:Georgia,serif;font-size:34px;color:var(--ink)}.small{font-size:12px;color:var(--muted);line-height:1.6}.back{background:none;border:0;font-size:14px;padding:0;color:var(--ink)}.count{font-size:12px;color:var(--gold)}@media(min-width:700px){#app{box-shadow:0 0 60px #b7b8ad}}
/* PHYTOTHECA — identidade editorial, clínica e herbário */
.view-more .top h2{color:#77495c}.view-calculator .top h2{color:#315c65}.view-favorites .top h2{color:#9b624b}.view-more .section h3{color:#77495c}.view-calculator .section h3{color:#315c65}

:root{--ink:#294c48;--muted:#65716c;--paper:#faf7f0;--line:#e0dbcf;--gold:#a27b48;--rust:#a85d49;--wine:#77495c;--petrol:#315c65;--sage:#e6eee6}
body{background:#dce4de;color:#273c38;font-family:'DM Sans',sans-serif}
#app{max-width:680px;background:var(--paper);box-shadow:0 15px 80px #263e3530}
.hero{background:linear-gradient(180deg,rgba(8,31,25,.58),rgba(10,36,29,.22) 38%,rgba(7,26,23,.96)),url('https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=1200&auto=format&fit=crop') center/cover;min-height:calc(100dvh - 74px);padding:38px 30px 32px}
.hero h1{font-family:'Cormorant Garamond',Georgia,serif;font-size:clamp(53px,12vw,80px);font-weight:500;letter-spacing:-2.5px;line-height:1.03}
.hero-center{margin-top:60px}.hero-sub{font-size:10px;letter-spacing:2.4px;color:#f2e7d3}.hero .eyebrow{color:#ead5af}
.hero-bottom{gap:17px}.hero .search{background:#f9f6ed;color:#29423d;padding:17px 19px;border-radius:9px}
.hero-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.hero-actions button{display:flex;align-items:center;justify-content:space-between;text-align:left;background:#f4efe5ed;color:#24483e;border:1px solid #e5dac5;border-radius:7px;padding:16px 12px;font-size:12px;font-weight:700}.hero-actions span{font-size:18px;color:#a65e47}
.hero-note{font-family:'Cormorant Garamond',Georgia,serif;font-size:22px;color:#ebd5b1}
.top{padding:36px 30px 17px}.content{padding:0 30px 35px}.top h2,.detail h2{font-family:'Cormorant Garamond',Georgia,serif;font-size:clamp(38px,8vw,51px);font-weight:600;letter-spacing:-1.3px;color:#2d5149;line-height:1.05}
.eyebrow,.section .label{color:var(--rust)!important;font-weight:700;letter-spacing:2px}.subtitle{font-size:12px;color:#6c7770}
.search{border-radius:9px;background:#fffefb;border:1px solid #d8dfd6;padding:16px 17px}
.plant{padding:17px 0;gap:17px;transition:background .15s}.plant:active{background:#edf2e9}.thumb{width:75px;height:76px;border-radius:6px;background:#e2e9dd;color:#486f5c;font-size:33px}.plant strong{font-family:'Cormorant Garamond',Georgia,serif;font-size:26px;font-weight:600;color:#294f47}.plant em{font-family:'Libre Baskerville',Georgia,serif;font-size:11px;color:#8b6a55;line-height:1.5}.plant .arrow{font-size:23px;color:#aa7055}
.tag.active,.tabs button.active,.action{background:#315d57;color:#fff}.tag{background:#f2f0e8}.detail-hero{height:240px;background:linear-gradient(145deg,#dfe9df,#a4bca8);color:#567965}.detail{padding:24px 30px 38px}.detail h2{color:#315c65}.latin{font-family:'Libre Baskerville',Georgia,serif;color:#936f57;font-size:15px}.back{color:#37685e}
.tabs{gap:8px;padding:22px 0 12px}.tabs button{border-radius:18px;padding:10px 13px;background:#ece9e0;color:#425b55}.tabs button.active{background:#315c65}
.section{padding:22px 0}.section h3{font-family:'Cormorant Garamond',Georgia,serif;font-size:29px;font-weight:600;color:#365c50;margin-bottom:9px}.section p{font-size:14px;line-height:1.85;color:#3b4744}.section.safety h3{color:#77495c}.section .label{font-size:10px}.notice{background:transparent;border-left:2px solid #ad755c;color:#705c55}
.nav{width:min(100%,680px);background:#fffdf8;height:75px;border-color:#dedfd5}.nav button{color:#7a817c}.nav button.active{color:#2d6857}
.field input,.field select{border-radius:7px;background:#fffefa}.result strong{font-family:'Cormorant Garamond',Georgia,serif;color:#315c65;font-size:44px}
@media(min-width:700px){#app{box-shadow:0 0 70px #657c6a55}}
@media(max-width:390px){.hero{padding:28px 20px}.top,.detail{padding-left:20px;padding-right:20px}.content{padding-left:20px;padding-right:20px}.hero-actions{grid-template-columns:1fr}}
</style></head><body><div id="app"></div><script>
const plants=[['Achyrocline satureioides','Macela'],['Aesculus hippocastanum','Castanha-da-índia'],['Allium sativum','Alho'],['Aloe vera','Babosa'],['Arnica montana','Arnica'],['Calendula officinalis','Calêndula'],['Cynara scolymus','Alcachofra'],['Echinacea purpurea','Equinácea'],['Equisetum arvense','Cavalinha'],['Ginkgo biloba','Ginkgo'],['Glycine max','Soja'],['Harpagophytum procumbens','Garra-do-diabo'],['Hypericum perforatum','Hipérico'],['Matricaria chamomilla','Camomila'],['Maytenus ilicifolia','Espinheira-santa'],['Melissa officinalis','Melissa'],['Mentha piperita','Hortelã-pimenta'],['Mikania glomerata','Guaco'],['Passiflora incarnata','Passiflora'],['Paullinia cupana','Guaraná'],['Peumus boldus','Boldo'],['Plantago ovata','Plantago'],['Rhamnus purshiana','Cáscara-sagrada'],['Salix alba','Salgueiro'],['Schinus terebinthifolia','Aroeira'],['Senna alexandrina','Sene'],['Valeriana officinalis','Valeriana'],['Zingiber officinale','Gengibre']].map((p,i)=>({id:i,scientific:p[0],name:p[1]}));
// Lista provisória de navegação: validar espécies e taxonomia contra as 28 monografias oficiais antes da entrega.
let page='home',selected=null,tab='Visão geral',query='',filter='Todas';let fav=new Set(JSON.parse(localStorage.getItem('phytotheca-favorites')||'[]'));const app=document.getElementById('app');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function navigate(p){page=p;query='';render();window.scrollTo(0,0)}function openPlant(id){selected=plants.find(p=>p.id===id);tab='Visão geral';page='detail';render();window.scrollTo(0,0)}function toggleFav(id){fav.has(id)?fav.delete(id):fav.add(id);localStorage.setItem('phytotheca-favorites',JSON.stringify([...fav]));render()}
function nav(){return `<nav class="nav">${[['home','⌂','Início'],['plants','♧','Plantas'],['favorites','♡','Favoritos'],['more','☷','Mais']].map(([p,i,t])=>`<button class="${page===p?'active':''}" onclick="navigate('${p}')"><b>${i}</b>${t}</button>`).join('')}</nav>`}
function home(){return `<div class="hero"><div><div class="eyebrow">Atlas clínico · Fitoterapia</div><div class="hero-center"><div style="font-size:28px;color:#d5c59a">❧</div><h1>PHYTOTHECA</h1><div class="hero-sub">BOTÂNICA, CIÊNCIA E PRÁTICA CLÍNICA</div></div></div><div class="hero-bottom"><input class="search" placeholder="Buscar planta, nome científico..." onfocus="navigate('plants')"><div class="hero-actions"><button onclick="navigate('plants')">Explorar atlas botânico <span>↗</span></button><button onclick="navigate('more')">Glossário e ferramentas <span>↗</span></button></div><div class="hero-note">Atlas de espécies · Memento Fitoterápico</div><div class="small" style="color:#ddd4c2">Protótipo acadêmico. Conteúdo clínico sujeito a validação.</div></div></div>`}
function listing(){let arr=plants.filter(p=>(page!=='favorites'||fav.has(p.id))&&(`${p.name} ${p.scientific}`).toLowerCase().includes(query.toLowerCase()));return `<div class="top"><div class="eyebrow" style="color:var(--gold)">Biblioteca científica</div><h2>${page==='favorites'?'Favoritos':'Plantas medicinais'}</h2><div class="subtitle">Catálogo provisório · confirmar 28 espécies na fonte oficial</div></div><div class="content"><input class="search" value="${esc(query)}" placeholder="Buscar por nome popular ou científico" oninput="query=this.value;updateList()"><div class="tags"><button class="tag active">Todas as espécies</button></div><div id="list">${plantRows(arr)}</div></div>`}
function plantRows(arr){return arr.length?arr.map(p=>`<button class="plant" onclick="openPlant(${p.id})"><span class="thumb">❧</span><span><strong>${esc(p.name)}</strong><em>${esc(p.scientific)}</em></span><span class="arrow">›</span></button>`).join(''):'<p class="small">Nenhuma planta encontrada.</p>'}function updateList(){const arr=plants.filter(p=>(page!=='favorites'||fav.has(p.id))&&(`${p.name} ${p.scientific}`).toLowerCase().includes(query.toLowerCase()));document.getElementById('list').innerHTML=plantRows(arr)}
function detail(){const p=selected;let body=tab==='Visão geral'?`<div class="section"><div class="label">Identificação botânica</div><h3>${esc(p.name)}</h3><p><i>${esc(p.scientific)}</i></p><p>Nome científico e denominações populares devem ser confrontados com a monografia oficial.</p></div><div class="section"><h3>Parte utilizada</h3><p>Aguardando validação científica.</p></div><div class="section"><h3>Sobre a espécie</h3><p>Ficha em preparação. Serão incluídas informações verificadas no Memento Fitoterápico da Farmacopeia Brasileira.</p></div>`:tab==='Segurança'?`<div class="section safety"><h3>Contraindicações</h3><p>Aguardando validação científica.</p></div><div class="section safety"><h3>Reações adversas</h3><p>Aguardando validação científica.</p></div><div class="section safety"><h3>Precauções</h3><p>Aguardando validação científica.</p></div>`:tab==='Interações'?`<div class="section"><h3>Interações medicamentosas</h3><p>Aguardando validação científica. Não presumir ausência de interações.</p></div>`:tab==='Uso e dose'?`<div class="section"><h3>Formas farmacêuticas e preparo</h3><p>Aguardando validação científica.</p></div><div class="section"><h3>Posologia, via e duração</h3><p>Aguardando validação científica.</p></div>`:`<div class="section"><h3>Indicações terapêuticas</h3><p>Aguardando validação científica. A busca por sintomas será habilitada após revisão das indicações das 28 monografias.</p></div>`;return `<div class="detail-hero">❧</div><div class="detail"><button class="back" onclick="navigate('plants')">← Voltar às plantas</button><div style="display:flex;align-items:center;justify-content:space-between"><h2>${esc(p.name)}</h2><button class="back" onclick="toggleFav(${p.id})" aria-label="Favorito" style="font-size:28px">${fav.has(p.id)?'♥':'♡'}</button></div><div class="latin">${esc(p.scientific)}</div><div class="tabs">${['Visão geral','Indicações','Uso e dose','Segurança','Interações'].map(t=>`<button class="${tab===t?'active':''}" onclick="tab='${t}';render()">${t}</button>`).join('')}</div>${body}<div class="section"><div class="label">Fonte obrigatória</div><p>Memento Fitoterápico da Farmacopeia Brasileira, Anvisa. Página e edição: a confirmar.</p></div><div class="notice">Este é um protótipo acadêmico, não uma orientação de prescrição. Dados ainda não validados não devem ser utilizados em atendimento.</div></div>`}
function calculator(){return `<div class="top"><div class="eyebrow" style="color:var(--gold)">Ferramentas</div><h2>Calculadora</h2><div class="subtitle">Conversão matemática de proporções previamente validadas</div></div><div class="content"><div class="section"><h3>Quantidade para preparo</h3><p>Informe a proporção retirada de uma monografia oficial. A calculadora não recomenda uma dose.</p></div><div class="field"><label>Quantidade de planta na proporção (g)</label><input id="grams" type="number" min="0" step="0.1" placeholder="Ex.: 2"></div><div class="field"><label>Volume de referência (mL)</label><input id="reference" type="number" min="0.01" placeholder="Ex.: 150"></div><div class="field"><label>Volume desejado (mL)</label><input id="volume" type="number" min="0.01" placeholder="Ex.: 300"></div><button class="action" onclick="calc()">Calcular proporção</button><div class="result" id="answer"><span class="small">Preencha os campos para calcular.</span></div><p class="small">Fórmula: massa desejada = massa de referência × volume desejado ÷ volume de referência. Não use o resultado sem conferir a posologia e a forma de preparo na monografia.</p></div>`}
function calc(){let g=+document.getElementById('grams').value,r=+document.getElementById('reference').value,v=+document.getElementById('volume').value;document.getElementById('answer').innerHTML=g>0&&r>0&&v>0?`<span class="small">Massa proporcional calculada</span><br><strong>${(g*v/r).toLocaleString('pt-BR',{maximumFractionDigits:3})} g</strong><p class="small">Resultado matemático, não uma recomendação clínica.</p>`:'<span class="small">Insira três números positivos.</span>'}
function more(){return `<div class="top"><div class="eyebrow" style="color:var(--gold)">Referência e apoio</div><h2>Glossário</h2><div class="subtitle">Técnicas e conceitos da fitoterapia</div></div><div class="content">${[['Infusão','Água aquecida vertida sobre material vegetal, mantido em contato por tempo determinado, geralmente com recipiente tampado.'],['Decocção','Preparação em que o material vegetal é aquecido com água durante tempo definido.'],['Maceração','Extração por contato do material vegetal com líquido apropriado, sem necessidade de fervura.'],['Tintura','Preparação extrativa líquida, geralmente obtida com solvente hidroalcoólico, sob condições padronizadas.']].map(([a,b])=>`<div class="section"><h3>${a}</h3><p>${b}</p></div>`).join('')}<div class="section"><h3>Fontes e limites</h3><p>Base documental: Memento Fitoterápico da Farmacopeia Brasileira (Anvisa). O catálogo é provisório; todas as espécies, imagens, nomes e monografias devem ser validados antes da apresentação.</p><p><a href="https://www.gov.br/anvisa/pt-br/assuntos/farmacopeia/formulario-fitoterapico" target="_blank" rel="noopener">Consultar materiais oficiais da Anvisa ↗</a></p></div><button class="action" onclick="navigate('calculator')">Abrir calculadora →</button></div>`}
function render(){app.className='view-'+page;app.innerHTML=(page==='home'?home():page==='plants'||page==='favorites'?listing():page==='detail'?detail():page==='calculator'?calculator():more())+nav()}render();
</script></body></html>
